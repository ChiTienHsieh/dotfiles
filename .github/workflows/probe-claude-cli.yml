name: probe claude cli (temporary)

on:
  pull_request:
    paths:
      - .github/workflows/probe-claude-cli.yml

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Install and run the pinned Claude Code CLI without credentials
        env:
          CLAUDE_CODE_DISABLE_AUTO_MEMORY: '1'
          CLAUDE_CODE_DISABLE_CLAUDE_MDS: '1'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-home
        shell: bash
        run: |
          set -euo pipefail
          cli_version='2.1.319'
          npm install --global --ignore-scripts --no-audit --no-fund "@anthropic-ai/claude-code@${cli_version}"
          node "$(npm root --global)/@anthropic-ai/claude-code/install.cjs"
          claude --version | grep -F "${cli_version}"
          mkdir -p "${CLAUDE_CONFIG_DIR}" "${RUNNER_TEMP}/claude-empty"
          set +e
          (cd "${RUNNER_TEMP}/claude-empty" && echo 'hello' | timeout 120 claude --print --tools '' --disallowedTools 'mcp__*' --strict-mcp-config --restricted --permission-mode dontAsk --permission-prompts none --disable-slash-commands --no-session-persistence --model claude-opus-5-5 --output-format json --system-prompt 'rules') > result.json 2> progress.log
          echo "exit=$?"
          set -e
          echo '--- stdout'; cat result.json; echo
          echo '--- stderr'; cat progress.log
          echo '--- jq'; jq -e '.is_error == false and (.result | type == "string" and length > 0)' result.json || echo "jq says not ok (expected without a token)"
