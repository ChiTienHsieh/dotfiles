name: TEMP Codex sandbox probe

# Temporary: proves on a hosted Linux runner that the Codex sandbox profile
# hides the credential directory. Uses no secrets. Removed before merge.
on:
  pull_request:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts --no-audit --no-fund "@openai/codex@0.167.0"
          codex --version
      - name: Diagnose
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        shell: bash
        run: |
          set -uo pipefail
          umask 077
          mkdir -p "${CODEX_HOME}"
          echo "# Pull request diff" > pr-review-input.md
          echo diag-canary > "${CODEX_HOME}/auth.json"
          cat > "${CODEX_HOME}/config.toml" <<EOF
          default_permissions = "ci-review"
          project_doc_max_bytes = 0
          web_search = "disabled"

          [features]
          apps = false

          [permissions.ci-review]
          extends = ":read-only"

          [permissions.ci-review.filesystem]
          "${CODEX_HOME}" = "deny"
          EOF
          sb() { echo "--- $*"; codex sandbox --permission-profile ci-review --cd "${GITHUB_WORKSPACE}" -- "$@"; echo "rc=$?"; }
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone kernel.yama.ptrace_scope || true
          command -v bwrap || true
          sb cat pr-review-input.md
          sb cat "${CODEX_HOME}/auth.json"
          sb sudo -n cat "${CODEX_HOME}/auth.json"
          sb ls -la "${CODEX_HOME}"
          sb touch "${GITHUB_WORKSPACE}/sandbox-write-probe"; ls sandbox-write-probe || true
          sb curl -sS -m 5 -o /dev/null https://example.com
          sb sh -c 'id; grep -i -E "nonewprivs|seccomp" /proc/self/status'
          echo "=== after allowing userns via sysctl"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sb cat pr-review-input.md
          sb cat "${CODEX_HOME}/auth.json"
          sb sudo -n cat "${CODEX_HOME}/auth.json"
          sb ls -la "${CODEX_HOME}"
          sb touch "${GITHUB_WORKSPACE}/sandbox-write-probe"; ls sandbox-write-probe || true
          sb curl -sS -m 5 -o /dev/null https://example.com
          sb sh -c 'id; grep -i -E "nonewprivs|seccomp" /proc/self/status'
          sb sh -c "cat /proc/$$/environ | tr '\\0' '\\n' | grep -c . ; head -c 20 /proc/$$/mem"
