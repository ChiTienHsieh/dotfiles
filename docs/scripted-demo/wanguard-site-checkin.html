<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>前台假想新功能：志工到場打卡 · scripted demo</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; height: 100dvh; padding: 16px; background: #0f172a;
         font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; transition: background-color .25s ease; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .player { height: 100%; max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column;
            border-radius: 18px; overflow: hidden; box-shadow: 0 20px 60px rgba(0, 0, 0, .45); background: #0f172a; }
  .device { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center; padding: 14px 0; }

  /* 配色取自光超前端的 design tokens（Frontend/libs/ui/src/theme/design-tokens.ts） */
  #stage { --bg: #FFFFFF; --bg-subtle: #F6FAFF; --bg-sunken: #EDF2F7; --ink: #0F172A; --ink-2: #334155; --muted: #64748B;
           --line: #CBD5E1; --line-2: #E2E8F0; --primary: #E3791E; --primary-subtle: #FDF3E9; --on-primary: #111111;
           --secondary: #2592B9; --sec-subtle: #EEF7FB; --ok: #1B5E20; --ok-bg: #E8F5E9; --warn-bg: #FFF3E0; --warn: #A33900;
           --scrim: rgba(15, 23, 42, .45); --shadow: 0 8px 32px rgba(227, 121, 30, .20);
           width: 390px; max-width: 100%; height: min(100%, 844px); border: 8px solid #1f2937; border-radius: 34px;
           position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-size: 14px; }
  /* 產品還沒有深色版；這裡用同一套色階的深色那端 */
  [data-sd-theme="dark"] body, [data-sd-theme="dark"] .player { background: #eee8d5; }
  [data-sd-theme="dark"] .player { box-shadow: 0 20px 60px rgba(92, 72, 20, .28); }
  [data-sd-theme="dark"] #stage { --bg: #1E293B; --bg-subtle: #273449; --bg-sunken: #334155; --ink: #F1F5F9; --ink-2: #CBD5E1; --muted: #94A3B8;
           --line: #475569; --line-2: #334155; --primary: #EC9C50; --primary-subtle: #4F2708; --on-primary: #111111;
           --secondary: #62BADA; --sec-subtle: #0C3240; --ok: #A5D6A7; --ok-bg: #1B3A1F; --warn-bg: #4F2708; --warn: #F5C08B;
           --scrim: rgba(0, 0, 0, .55); --shadow: 0 8px 32px rgba(0, 0, 0, .45); border-color: #93a1a1; color-scheme: dark; }
  @media (max-width: 520px) {
    body { padding: 0; } .player { border-radius: 0; } .device { padding: 0; }
    #stage { width: 100%; height: 100%; border: 0; border-radius: 0; }
  }

  .appbar { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-bottom: 1px solid var(--line-2); background: var(--bg); }
  .appbar .logo { width: 24px; height: 24px; border-radius: 7px; background: linear-gradient(135deg, var(--primary), var(--secondary)); }
  .appbar b { flex: 1; font-size: 15px; } .appbar .back { border: 0; background: none; font-size: 22px; line-height: 1; padding: 0 2px; }
  .appbar .back[hidden], .appbar .logo[hidden] { display: none; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--sec-subtle); color: var(--secondary); font-size: 12px; font-weight: 700; }
  .screen { flex: 1; min-height: 0; padding: 14px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; background: var(--bg-subtle); }
  .screen[hidden] { display: none; }
  .h { margin: 0; font-size: 13px; color: var(--muted); font-weight: 700; }
  .card { padding: 12px 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--bg); text-align: left; width: 100%; }
  .card h4 { margin: 0 0 2px; font-size: 16px; } .card p { margin: 0; color: var(--ink-2); font-size: 13px; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .chip { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--bg-sunken); color: var(--ink-2); }
  .chip.claimed { background: var(--sec-subtle); color: var(--secondary); }
  .chip.arrived { background: var(--ok-bg); color: var(--ok); }
  .chip[hidden] { display: none; }
  .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--bg-sunken); overflow: hidden; } .bar i { display: block; height: 100%; background: var(--primary); }
  .count { font-size: 12px; color: var(--muted); font-weight: 700; }
  .new { margin-left: 6px; padding: 1px 6px; border-radius: 6px; background: var(--warn-bg); color: var(--warn); font-size: 11px; font-weight: 700; vertical-align: 2px; }
  .btn { min-height: 44px; border: 0; border-radius: 999px; background: var(--primary); color: var(--on-primary); font-weight: 700; font-size: 15px; width: 100%; }
  .btn[hidden] { display: none; }
  .btn.ghost { background: var(--bg); border: 1px solid var(--line); color: var(--ink); }
  .info { padding: 10px 12px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line-2); font-size: 13px; color: var(--ink-2); }
  .info b { color: var(--ink); }

  /* 底部抽屜（bottom sheet） */
  .scrim { position: absolute; inset: 0; background: var(--scrim); }
  .scrim[hidden], .sheet[hidden] { display: none; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 16px; border-radius: 20px 20px 0 0; background: var(--bg);
           display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); }
  .sheet .grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 2px; }
  .sheet h3 { margin: 0; font-size: 17px; } .sheet p { margin: 0; color: var(--ink-2); font-size: 13px; }
  .gps { position: relative; height: 92px; border-radius: 12px; background: #E8EFE0; overflow: hidden; border: 1px solid var(--line-2); }
  [data-sd-theme="dark"] .gps { background: #2B3A33; }
  .gps .ring { position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%; border: 2px dashed var(--secondary); background: rgba(37, 146, 185, .12); }
  .gps .me { position: absolute; left: 56%; top: 54%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--secondary); border: 3px solid #fff; }
  .gps .site { position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 3px; background: var(--primary); }
  .opts { display: flex; gap: 8px; }
  .opt { flex: 1; min-height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-size: 14px; }
  .opt.on { border-color: var(--secondary); background: var(--sec-subtle); font-weight: 800; }
  .inp { width: 100%; min-height: 40px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-subtle); color: var(--ink); font: inherit; font-size: 14px; }
  .toast { position: absolute; left: 14px; right: 14px; bottom: 14px; padding: 12px 14px; border-radius: 14px; background: var(--ok-bg); color: var(--ok); font-weight: 700; box-shadow: var(--shadow); }
  .toast[hidden] { display: none; }
  .sd-press { transform: scale(.97); }
</style>
</head>
<body>

<div class="player">
<div class="device">
<main id="stage">
  <div class="appbar">
    <button class="back" data-demo="back" id="back" hidden>‹</button><span class="logo" id="logo"></span>
    <b id="bar-title">我承接的</b><span class="avatar">林</span>
  </div>

  <section class="screen" data-screen="mine">
    <p class="h">今天承接的需求</p>
    <button class="card" data-demo="my-claim">
      <h4>教室鏟泥人力</h4>
      <p>光復國小教室泥水清理</p>
      <div class="row"><span class="chip claimed">已承接</span><span class="chip arrived" id="list-arrived" hidden>已到場</span><span class="count">今天 09:00 集合</span></div>
    </button>
    <button class="card" disabled>
      <h4>分送志工（3 人一組）</h4>
      <p>大進村獨居長者物資配送</p>
      <div class="row"><span class="chip claimed">已承接</span><span class="count">明天 14:00 集合</span></div>
    </button>
  </section>

  <section class="screen" data-screen="detail" hidden>
    <div class="card" data-demo="need-card">
      <h4>教室鏟泥人力</h4>
      <p>光復國小教室泥水清理</p>
      <div class="row"><div class="bar"><i id="fill" style="width:86%"></i></div><span class="count" id="headcount">到場 9 / 承接 12</span></div>
      <div class="row"><span class="chip claimed">你已承接</span><span class="chip arrived" data-demo="arrived-chip" id="arrived-chip" hidden>已到場 09:42</span></div>
    </div>
    <div class="info" data-demo="meet-info">集合地點：<b>光復國小穿堂</b><br>帶：雨鞋、手套，現場有鏟子</div>
    <div style="flex:1"></div>
    <button class="btn" data-demo="arrive" id="arrive">我到現場了<span class="new">新功能</span></button>
    <button class="btn" data-demo="report" id="report" hidden>回報完成<span class="new">新功能</span></button>
    <button class="btn ghost" data-demo="done-note" id="done-note" hidden>已回報完成，謝謝你</button>
  </section>

  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet" data-demo="sheet-arrive" id="sheet-arrive" hidden>
    <div class="grip"></div>
    <h3>確認到場</h3>
    <p>定位顯示你在光復國小 <b>80 公尺</b>內。</p>
    <div class="gps" data-demo="gps"><span class="ring"></span><span class="site"></span><span class="me"></span></div>
    <button class="btn" data-demo="confirm-arrive">確認到場</button>
  </div>
  <div class="sheet" data-demo="sheet-report" id="sheet-report" hidden>
    <div class="grip"></div>
    <h3>回報完成</h3>
    <p>現場還缺人嗎？</p>
    <div class="opts" data-demo="crew-opts">
      <button class="opt" data-crew="more" data-demo="crew-more">還缺人</button>
      <button class="opt" data-crew="enough" data-demo="crew-enough">人夠了</button>
    </div>
    <input class="inp" data-demo="note" placeholder="想讓下一批志工知道什麼？（選填）">
    <button class="btn" data-demo="send-report">送出回報</button>
  </div>
  <div class="toast" data-demo="toast" id="toast" hidden>已回報，任務負責人會看到</div>
</main>
</div>
<div id="tour-controls"></div>
</div>


<script>

    '.sd-layer{position:absolute;inset:0;pointer-events:none;z-index:2147483000;overflow:hidden;--sd-move:720ms;--_dim:var(--sd-dim,rgba(15,23,42,.55));--_accent:var(--sd-accent,#3b82f6);--_curtain:var(--sd-bar,#0b1220);--_card:#fff;--_card-ink:#0f172a;--_card-muted:#64748b;--_card-line:#e2e8f0;--_card-q:#f1f5f9}',
    '[data-sd-theme="dark"] .sd-layer{--_dim:var(--sd-dark-dim,rgba(0,0,0,.45));--_accent:var(--sd-dark-accent,#60a5fa);--_curtain:#000;--_card:#343746;--_card-ink:#f8f8f2;--_card-muted:#9ea9d2;--_card-line:#44475a;--_card-q:#282a36}',

        if (b.hasAttribute('data-sd-sec')) self.playSection(+b.getAttribute('data-sd-sec'));
        else if (a === 'prev') { self.playing = false; self.prev(); }
        else if (a === 'next') { self.playing = false; self.next(); }
        else if (a === 'toggle') { if (self.playing) self.pause(); else self.play(); }
        else if (a === 'free') { if (self.touring) self.stop(); }
        else if (a === 'theme') self.toggleTheme();
        return;
      }
      var dot = e.target.closest('[data-i]');
      if (dot) { self.playing = false; self.goTo(+dot.getAttribute('data-i')); }
    });
    c.querySelector('[data-sd="speed"]').addEventListener('change', function (e) { self._setSpeed(+e.target.value); });
  };

  P._sync = function () {
    if (!this.controls) return;
    var c = this.controls, f = this.frames[this.idx], r = this._range();
    var small = c.querySelector('.sd-narr small'), text = c.querySelector('.sd-narr div');
    if (!f) {
      small.textContent = '自己點點看，或選一個章節開始導覽';
      text.textContent = '按 ▶ 播放會從頭演一遍；鍵盤 → ← 一步一步看';
    } else {
      var sec = this.sections[f.section];
      if (f.type === 'step') { small.textContent = sec.title + ' · 第 ' + f.n + ' 步 / 共 ' + f.total + ' 步'; text.textContent = f.step.say || ''; }
      else { small.textContent = sec.title + (f.type === 'intro' ? ' · 開始' : ' · 總結'); text.textContent = f.type === 'intro' ? '按 ▶ 播放，或按 → 一步一步看'
        : this.idx >= r[1] ? '導覽結束：點上面的章節重看，或按「自己點點看」自己操作' : '看完重點，按 → 繼續下一段'; }
    }
    c.querySelector('[data-sd="toggle"]').textContent = this.playing ? '❚❚ 暫停' : '▶ 播放';
    c.querySelector('[data-sd="prev"]').disabled = !f || this.idx <= r[0];
    c.querySelector('[data-sd="next"]').disabled = !!f && this.idx >= r[1];
    c.querySelector('[data-sd="speed"]').value = String(this.speed);
    c.querySelector('[data-sd="free"]').classList.toggle('sd-on', !this.touring);
    var th = c.querySelector('[data-sd="theme"]'), dark = this.theme === 'dark';
    th.textContent = dark ? '☀ 淺色' : '☾ 深色';
    th.title = dark ? '切換成淺色畫面' : '切換成深色畫面';
    th.setAttribute('aria-pressed', String(dark));
    c.querySelectorAll('[data-sd-sec]').forEach(function (b) { b.classList.toggle('sd-on', !!f && f.section === +b.getAttribute('data-sd-sec')); });
    var dots = '';
    for (var i = r[0]; i <= r[1]; i++) dots += '<i data-i="' + i + '" class="' + (i < this.idx ? 'sd-done' : i === this.idx ? 'sd-cur' : '') + '"></i>';
    c.querySelector('.sd-dots').innerHTML = f ? dots : '';
  };

  P._setSpeed = function (s) {
    this.speed = s;
    this.layer.style.setProperty('--sd-move', Math.round(T.move / s) + 'ms');
    this._sync();
  };

  // 鍵盤：→ 下一步、← 上一步、空白鍵 播放/暫停、Esc 停止；正在輸入文字時不攔
  P._key = function (e) {
    var t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
    if (e.key === 'ArrowRight') { this.playing = false; this.next(); }
    else if (e.key === 'ArrowLeft') { this.playing = false; this.prev(); }
    else if (e.key === ' ') { e.preventDefault(); if (this.playing) this.pause(); else this.play(); }
    else if (e.key === 'Escape' && this.touring) this.stop();
  };

  // ---------- 小工具 ----------

  P._range = function () {
    if (this.only === null) return [0, this.frames.length - 1];
    var a = -1, b = -1, si = this.only;
    this.frames.forEach(function (f, i) { if (f.section === si) { if (a < 0) a = i; b = i; } });
    return [a, b];
  };
  P._find = function (name) { return name ? this.stage.querySelector('[data-demo="' + name + '"]') : null; };
  P._alive = function (my) { return my === this.gen; };
  P._wait = function (ms, my, instant) {
    var self = this;
    if (instant) return Promise.resolve(this._alive(my));
    return new Promise(function (r) { setTimeout(function () { r(self._alive(my)); }, ms / self.speed); });
  };
  P._instant = function (on) {
    this.layer.classList.toggle('sd-instant', on);
    if (!on) this.layer.offsetWidth; // 讓瀏覽器先吃下「有動畫」的狀態再改位置
  };
  P._clearMarks = function () {
    this.stage.querySelectorAll('.sd-hover,.sd-press').forEach(function (e) { e.classList.remove('sd-hover', 'sd-press'); });
  };
  P._render = function () { this.renderFn(this.state, this.stage); };

  function setText(e, v) { if ('value' in e) e.value = v; else e.textContent = v; }

  global.ScriptedDemo = {
    create: function (o) { var p = new Player(o); global.__scriptedDemo = p; return p; },
    version: '1.2.0'
  };
})(window);

</script>
<script>
  var NOTE = '一樓 3 間清完，二樓還有 2 間';
  var initialState = { screen: 'mine', sheet: null, arrived: false, crew: null, note: '', reported: false, toast: false };
  var ON_SITE = { screen: 'detail', arrived: true };

  function render(s, stage) {
    stage.querySelectorAll('[data-screen]').forEach(function (el) { el.hidden = el.getAttribute('data-screen') !== s.screen; });
    var detail = s.screen === 'detail';
    stage.querySelector('#back').hidden = !detail;
    stage.querySelector('#logo').hidden = detail;
    stage.querySelector('#bar-title').textContent = detail ? '需求詳情' : '我承接的';
    stage.querySelector('#list-arrived').hidden = !s.arrived;
    stage.querySelector('#arrived-chip').hidden = !s.arrived;
    stage.querySelector('#headcount').textContent = '到場 ' + (s.arrived ? 10 : 9) + ' / 承接 12';
    stage.querySelector('#fill').style.width = (s.arrived ? 83 : 75) + '%';
    stage.querySelector('#arrive').hidden = s.arrived;
    stage.querySelector('#report').hidden = !s.arrived || s.reported;
    stage.querySelector('#done-note').hidden = !s.reported;
    stage.querySelector('#scrim').hidden = !s.sheet;
    stage.querySelector('#sheet-arrive').hidden = s.sheet !== 'arrive';
    stage.querySelector('#sheet-report').hidden = s.sheet !== 'report';
    stage.querySelectorAll('[data-crew]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-crew') === s.crew); });
    var note = stage.querySelector('[data-demo="note"]'); if (note.value !== s.note) note.value = s.note;
    stage.querySelector('#toast').hidden = !s.toast;
  }

  var demo = ScriptedDemo.create({
    stage: '#stage',
    controls: '#tour-controls',
    device: 'phone',
    initialState: initialState,
    render: render,
    sections: [
      {
        title: '到現場打卡',
        intro: '想像中的新功能，還沒有要做，只是拿來示範 scripted-demo。\n志工接了「教室鏟泥人力」，到光復國小後在手機上打卡。',
        keyframe: {},
        steps: [
          { target: 'my-claim', say: '在「我承接的」點今天要去的那一筆。', set: { screen: 'detail' }, after: 'need-card' },
          { target: 'meet-info', do: 'point', say: '先看集合地點和要帶的東西。' },
          { target: 'arrive', say: '到了就按「我到現場了」。', set: { sheet: 'arrive' }, after: 'gps', afterFocus: 'sheet-arrive' },
          { target: 'confirm-arrive', say: '手機定位確認人在附近，按「確認到場」。', set: { sheet: null, arrived: true }, after: 'arrived-chip', afterFocus: 'need-card' }
        ],
        summary: { points: ['現場負責人知道誰已經到了、誰還沒到', '到場人數即時更新，不用一個一個打電話問'] }
      },
      {
        title: '做完回報',
        intro: '清完教室，回報現場還缺不缺人，讓下一批志工知道狀況。',
        keyframe: ON_SITE,
        steps: [
          { target: 'report', say: '做完按「回報完成」。', set: { sheet: 'report' }, after: 'crew-opts', afterFocus: 'sheet-report' },
          { target: 'crew-more', focus: 'crew-opts', say: '二樓還沒清完，選「還缺人」。', set: { crew: 'more' } },
          { target: 'note', do: 'type', text: NOTE, say: '寫一句給下一批志工的話。', set: { note: NOTE } },
          { target: 'send-report', say: '按「送出回報」。', set: { sheet: null, reported: true, toast: true }, after: 'toast' }
        ],
        summary: { title: '好處與要注意的地方',
                   pros: ['負責人不用打電話一個一個問', '下一批志工出發前就知道現場狀況'],
                   cons: ['山區沒訊號或定位不準時，要能手動打卡', '定位是個資，只在按下按鈕那一刻讀一次'] }
      }
    ]
  });

  document.getElementById('stage').addEventListener('click', function (e) {
    var b = e.target.closest('[data-demo], [data-crew]'); if (!b) return;
    var n = b.getAttribute('data-demo'), crew = b.getAttribute('data-crew');
    if (crew) demo.update({ crew: crew });
    else if (n === 'my-claim') demo.update({ screen: 'detail' });
    else if (n === 'back') demo.update({ screen: 'mine', sheet: null, toast: false });
    else if (n === 'arrive') demo.update({ sheet: 'arrive' });
    else if (n === 'confirm-arrive') demo.update({ sheet: null, arrived: true });
    else if (n === 'report') demo.update({ sheet: 'report' });
    else if (n === 'send-report') demo.update({ sheet: null, reported: true, toast: true });
  });
  document.getElementById('scrim').addEventListener('click', function () { demo.update({ sheet: null }); });
  document.querySelector('[data-demo="note"]').addEventListener('input', function (e) { demo.update({ note: e.target.value }); });
</script>
</body>
</html>
