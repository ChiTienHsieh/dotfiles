<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mermaid Flowchart 編輯器</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1e8;
      --panel: #fffdf7;
      --ink: #1e2926;
      --muted: #66716c;
      --line: #cbd2cb;
      --accent: #176b5b;
      --accent-soft: #dceee8;
      --warning: #875400;
      --warning-bg: #fff2cf;
      --danger: #9b3434;
      --focus: #0c7bdc;
      --shadow: 0 10px 30px rgba(32, 44, 40, .09);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
    }

    button, input, select, textarea { font: inherit; }

    button, select, input, textarea {
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      color: var(--ink);
    }

    button {
      min-height: 42px;
      padding: .55rem .8rem;
      cursor: pointer;
      font-weight: 700;
    }

    button:hover { border-color: var(--accent); }
    button:active { transform: translateY(1px); }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.quiet { background: transparent; }
    button.danger { color: var(--danger); border-color: #ddb8b8; background: #fff8f8; }

    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible,
    [tabindex="0"]:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 35%, transparent);
      outline-offset: 2px;
    }

    .panel {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      gap: .6rem;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
      padding: .65rem .8rem;
      border-bottom: 1px solid var(--line);
    }

    .panel-head h2 { margin: 0; font-size: .95rem; }
    .panel-head small { color: var(--muted); }

    .code-panel { display: grid; grid-template-rows: auto minmax(300px, 1fr) auto; }

    #code {
      width: 100%;
      min-height: 420px;
      resize: none;
      border: 0;
      border-radius: 0;
      padding: 1rem;
      background: #18211f;
      color: #e9f1ee;
      font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      tab-size: 2;
    }

    #code:focus-visible { outline-offset: -3px; }

    .warnings {
      display: none;
      padding: .7rem .85rem;
      color: var(--warning);
      background: var(--warning-bg);
      border-top: 1px solid #e9ce83;
      font-size: .82rem;
      line-height: 1.45;
    }

    .warnings.show { display: block; }
    .warnings strong { display: block; margin-bottom: .25rem; }
    .warnings ul { margin: 0; padding-left: 1.15rem; }

    .canvas-wrap { position: relative; min-height: 430px; background: #fbfaf5; overflow: hidden; }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 430px;
      touch-action: none;
      background-image:
        linear-gradient(#dfe4df 1px, transparent 1px),
        linear-gradient(90deg, #dfe4df 1px, transparent 1px);
      background-size: 24px 24px;
      background-position: -1px -1px;
    }

    .canvas-note {
      margin: 0;
      padding: .7rem .85rem;
      color: var(--muted);
      background: #f8f5eb;
      border-top: 1px solid var(--line);
      font-size: .78rem;
      line-height: 1.45;
    }

    .inspector { display: grid; grid-template-rows: auto 1fr; }
    .inspector-body { padding: .9rem; overflow: auto; }
    .inspector-section[hidden] { display: none; }
    .inspector-section h3 { margin: 0 0 .75rem; font-size: 1rem; }

    .field { display: grid; gap: .3rem; margin-bottom: .8rem; }
    .field label { color: var(--muted); font-size: .8rem; font-weight: 700; }
    .field input, .field select, .field textarea { width: 100%; padding: .62rem .7rem; }
    .field textarea { min-height: 92px; resize: vertical; line-height: 1.45; }
    .field .hint { margin: 0; color: var(--muted); font-size: .75rem; line-height: 1.4; }
    .value-chip { display: inline-block; padding: .25rem .5rem; border-radius: 7px; background: var(--accent-soft); font: 700 .82rem ui-monospace, monospace; }
    .inspector-actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: 1rem; }

    .svg-node { cursor: grab; touch-action: none; }
    .svg-node:active { cursor: grabbing; }
    .node-shape { fill: #fffdf7; stroke: #43534e; stroke-width: 2; vector-effect: non-scaling-stroke; }
    .svg-node.selected .node-shape { stroke: var(--accent); stroke-width: 4; }
    .node-label { fill: var(--ink); font-size: 16px; font-weight: 750; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
    .node-id { fill: var(--muted); font-size: 10px; font-family: ui-monospace, monospace; text-anchor: middle; pointer-events: none; }
    .edge-line { fill: none; stroke: #53645e; stroke-width: 2.2; vector-effect: non-scaling-stroke; }
    .edge-line.dashed { stroke-dasharray: 8 6; }
    .edge-line.thick { stroke-width: 4.5; }
    .edge-line.selected { stroke: var(--accent); stroke-width: 4; }
    .edge-hit { fill: none; stroke: transparent; stroke-width: 20; cursor: pointer; }
    .edge-label-bg { fill: #fbfaf5; stroke: #d2d8d3; }
    .edge-label { fill: var(--ink); font-size: 13px; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
    .comment-badge circle { fill: #f4b942; stroke: #6d4b00; stroke-width: 1.5; }
    .comment-badge text { fill: #3d2a00; font: 800 11px ui-sans-serif, sans-serif; text-anchor: middle; dominant-baseline: middle; }

    dialog {
      width: min(560px, calc(100vw - 2rem));
      max-height: calc(100vh - 2rem);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0;
      color: var(--ink);
      background: var(--panel);
      box-shadow: 0 24px 90px rgba(0, 0, 0, .22);
    }

    dialog::backdrop { background: rgba(20, 30, 27, .45); }
    .dialog-body { padding: 1rem; }
    .dialog-body h2 { margin: 0 0 .9rem; font-size: 1.05rem; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: .5rem; padding: .8rem 1rem; border-top: 1px solid var(--line); }
    #importText, #exportText { width: 100%; min-height: 260px; padding: .8rem; font: 13px/1.5 ui-monospace, monospace; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(1rem, env(safe-area-inset-bottom));
      z-index: 80;
      max-width: min(520px, calc(100vw - 2rem));
      padding: .75rem 1rem;
      border-radius: 999px;
      color: #fff;
      background: #26332f;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translate(-50%, 12px);
      pointer-events: none;
      transition: .18s ease;
      text-align: center;
      font-size: .88rem;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* Canvas-first shell, visually grounded in Excalidraw's floating-tool pattern. */
    :root {
      --bg: #ffffff;
      --panel: #ffffff;
      --ink: #1b1b1f;
      --muted: #6f6f78;
      --line: #e3e3e8;
      --accent: #6965db;
      --accent-soft: #e8e7ff;
      --warning: #9a5b00;
      --warning-bg: #fff7db;
      --danger: #c92a2a;
      --focus: #6965db;
      --shadow: 0 4px 18px rgba(30, 30, 42, .12), 0 1px 2px rgba(30, 30, 42, .08);
    }

    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
    body { overscroll-behavior: none; }
    .sr-only { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important; }
    .editor-shell { position: fixed; inset: 0; overflow: hidden; background: #fff; }

    .icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    .icon-button, .tool-button {
      position: relative;
      display: inline-grid;
      place-items: center;
      width: 44px;
      height: 44px;
      min-height: 44px;
      padding: 0;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #202024;
      box-shadow: none;
    }
    .icon-button:hover, .tool-button:hover { background: #f1f1f5; border: 0; }
    .icon-button:active, .tool-button:active { transform: none; background: #e9e9ef; }
    .tool-button.selected { color: #312e91; background: var(--accent-soft); }
    .tool-button .shortcut { position: absolute; right: 4px; bottom: 2px; color: #a0a0a8; font: 600 11px/1 ui-sans-serif, sans-serif; }
    .tool-button.selected .shortcut { color: #6965db; }

    [data-tip]::after {
      content: attr(data-tip);
      position: absolute;
      top: calc(100% + 9px);
      left: 50%;
      z-index: 90;
      padding: .35rem .48rem;
      border-radius: 6px;
      color: #fff;
      background: #25252b;
      font-size: 11px;
      font-weight: 650;
      white-space: nowrap;
      opacity: 0;
      transform: translate(-50%, -2px);
      pointer-events: none;
      transition: opacity .12s ease, transform .12s ease;
    }
    [data-tip]:hover::after, [data-tip]:focus-visible::after { opacity: 1; transform: translate(-50%, 0); }

    .floating-cluster {
      position: fixed;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px;
      border: 1px solid #e3e3e8;
      border-radius: 13px;
      background: rgba(255, 255, 255, .96);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }
    .top-left { top: 18px; left: 18px; }
    .top-right { top: 18px; right: 18px; }
    .tool-palette { top: 18px; left: 50%; transform: translateX(-50%); gap: 3px; }
    .tool-divider { width: 1px; height: 28px; margin: 0 4px; background: #e6e6eb; }
    .brand-mark { padding: 0 .65rem 0 .35rem; color: #6f6f78; font-size: 13px; font-weight: 750; white-space: nowrap; }

    .export-button {
      display: inline-flex;
      gap: .45rem;
      align-items: center;
      min-height: 44px;
      padding: 0 .85rem;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      box-shadow: none;
    }
    .export-button:hover { border: 0; background: #5b57c7; }
    .export-button .icon { width: 18px; height: 18px; }

    .stage { position: fixed; inset: 0; z-index: 1; overflow: hidden; background: #fff; }
    .canvas-wrap { position: absolute; inset: 0; min-height: 0; overflow: hidden; background: #fff; }
    #canvas {
      width: 100%;
      height: 100%;
      min-height: 0;
      touch-action: none;
      background-color: #fff;
      background-image: radial-gradient(circle, #d8d8df 1px, transparent 1px);
      background-size: 20px 20px;
      background-position: 0 0;
    }
    #canvas.tool-hand { cursor: grab; }
    #canvas.tool-hand:active { cursor: grabbing; }
    #canvas.tool-rect, #canvas.tool-diamond, #canvas.tool-round, #canvas.tool-pill, #canvas.tool-edge, #canvas.tool-comment { cursor: crosshair; }
    .node-shape { fill: #fff; stroke: #1f1f24; stroke-width: 2; }
    .svg-node.selected .node-shape { stroke: var(--accent); stroke-width: 3; }
    .svg-node.edge-origin .node-shape { stroke: var(--accent); stroke-width: 4; stroke-dasharray: 7 4; }
    .node-label { fill: #202024; font-size: 17px; font-weight: 550; }
    .node-id { fill: #8b8b94; }
    .edge-line { stroke: #202024; stroke-width: 2; }
    .edge-line.selected { stroke: var(--accent); stroke-width: 3; }
    .edge-hit { stroke-width: 26; }
    .edge-label-bg { fill: #fff; stroke: #dedee4; }
    .comment-badge circle { fill: #ffe066; stroke: #8f5f00; }

    .canvas-status {
      position: fixed;
      left: 18px;
      bottom: 18px;
      z-index: 12;
      display: flex;
      align-items: center;
      gap: .65rem;
      min-height: 38px;
      padding: 0 .8rem;
      border-radius: 10px;
      color: #6f6f78;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 2px 10px rgba(30, 30, 42, .09);
      font-size: 12px;
      backdrop-filter: blur(10px);
    }
    .canvas-status strong { color: #33333a; }
    #toolHint { color: #8a8a94; }

    .dock {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 25;
      display: flex;
      gap: 8px;
    }
    .dock-button {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      min-height: 42px;
      padding: 0 .75rem;
      border: 1px solid #e3e3e8;
      border-radius: 10px;
      background: #fff;
      color: #33333a;
      box-shadow: var(--shadow);
      font-size: 12px;
    }
    .dock-button:hover { border-color: #d3d3da; background: #f8f8fa; }
    .warning-dot { display: none; width: 8px; height: 8px; border-radius: 50%; background: #f08c00; }
    .has-warnings .warning-dot { display: inline-block; }

    .menu-popover {
      position: fixed;
      top: 76px;
      left: 18px;
      z-index: 45;
      width: 248px;
      padding: 8px;
      border: 1px solid #e3e3e8;
      border-radius: 13px;
      background: #fff;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(-6px) scale(.98);
      transform-origin: top left;
      pointer-events: none;
      transition: opacity .14s ease, transform .14s ease;
    }
    .menu-popover.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    .menu-popover button {
      display: flex;
      width: 100%;
      min-height: 40px;
      gap: .7rem;
      align-items: center;
      padding: 0 .65rem;
      border: 0;
      background: #fff;
      box-shadow: none;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
    }
    .menu-popover button:hover { background: #f3f3f6; }
    .menu-popover .icon { width: 18px; height: 18px; color: #5c5c65; }
    .menu-rule { height: 1px; margin: 6px 4px; background: #ececf0; }

    .panel { border: 1px solid #e3e3e8; border-radius: 14px; background: #fff; box-shadow: var(--shadow); }
    .panel-head { min-height: 52px; padding: .65rem .85rem; border-bottom: 1px solid #ededf1; }
    .panel-head h2 { font-size: 14px; }
    .panel-head small { font-size: 11px; }
    .panel-close { width: 34px; height: 34px; min-height: 34px; padding: 0; border: 0; background: transparent; box-shadow: none; }
    .panel-close .icon { width: 18px; height: 18px; }

    .inspector {
      position: fixed;
      top: 88px;
      left: 18px;
      z-index: 28;
      display: grid;
      width: 294px;
      max-height: calc(100vh - 130px);
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
      opacity: 0;
      transform: translateX(-18px) scale(.98);
      pointer-events: none;
      transition: opacity .14s ease, transform .14s ease;
    }
    .inspector.open { opacity: 1; transform: translateX(0) scale(1); pointer-events: auto; }
    .inspector-body { padding: .9rem; overflow: auto; }
    .inspector-section h3 { display: flex; align-items: center; justify-content: space-between; margin: 0 0 .85rem; font-size: 15px; }
    .field { margin-bottom: .9rem; }
    .field label { color: #37373d; font-size: 12px; }
    .field input, .field select, .field textarea { border-color: #dcdce2; border-radius: 8px; background: #fff; font-size: 13px; }
    .field textarea { min-height: 78px; }
    .field .hint { color: #898992; font-size: 10.5px; }
    .value-chip { background: var(--accent-soft); color: #4e4ab8; }
    .shape-picker, .line-picker { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
    .line-picker { grid-template-columns: repeat(4, 1fr); }
    .shape-option, .line-option {
      display: grid;
      place-items: center;
      min-height: 50px;
      padding: 0;
      border: 0;
      border-radius: 10px;
      background: #f4f4f7;
      box-shadow: none;
    }
    .shape-option:hover, .line-option:hover { border: 0; background: #ececf2; }
    .shape-option.selected, .line-option.selected { color: #312e91; background: var(--accent-soft); }
    .shape-option .icon, .line-option .icon { width: 24px; height: 24px; }
    .inspector-actions { margin-top: .4rem; }
    .inspector-actions button { min-height: 38px; font-size: 12px; }
    .inspector .canvas-note { margin: 0 0 .75rem; padding: .65rem; border: 0; border-radius: 8px; background: #f7f7f9; font-size: 10.5px; }

    .code-panel {
      position: fixed;
      top: 18px;
      right: 18px;
      bottom: 72px;
      z-index: 35;
      display: grid;
      width: min(410px, calc(100vw - 36px));
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
      opacity: 0;
      transform: translateX(calc(100% + 30px));
      pointer-events: none;
      transition: opacity .18s ease, transform .2s ease;
    }
    .code-panel.open { opacity: 1; transform: translateX(0); pointer-events: auto; }
    #code { min-height: 0; height: 100%; padding: 1rem; background: #202124; color: #f1f3f4; font-size: 13px; }
    .warnings { max-height: 180px; overflow: auto; }

    dialog { border-color: #dedee4; border-radius: 14px; }
    .dialog-body h2 { font-size: 17px; }

    @media (max-width: 820px) {
      .brand-mark { display: none; }
      .top-left { top: 10px; left: 10px; }
      .top-right { top: 10px; right: 10px; }
      .top-right .export-label { display: none; }
      .export-button { width: 44px; padding: 0; justify-content: center; }
      .tool-palette {
        top: auto;
        right: 10px;
        bottom: max(10px, env(safe-area-inset-bottom));
        left: 10px;
        justify-content: center;
        overflow-x: auto;
        transform: none;
      }
      .tool-palette .tool-button { flex: 0 0 42px; width: 42px; height: 42px; }
      .tool-palette .tool-divider { display: none; }
      [data-tip]::after { display: none; }
      .canvas-status { top: 66px; right: 10px; bottom: auto; left: 10px; justify-content: center; min-height: 30px; box-shadow: none; background: transparent; }
      .canvas-status #toolHint { display: none; }
      .dock { right: 10px; bottom: 68px; }
      .dock-button span:not(.warning-dot) { display: none; }
      .dock-button { width: 44px; padding: 0; justify-content: center; }
      .menu-popover { top: 64px; left: 10px; width: 238px; }
      .inspector {
        top: auto;
        right: 8px;
        bottom: 66px;
        left: 8px;
        width: auto;
        max-height: min(52vh, 460px);
        transform: translateY(24px) scale(.99);
      }
      .inspector.open { transform: translateY(0) scale(1); }
      .code-panel { top: auto; right: 8px; bottom: 66px; left: 8px; width: auto; height: min(66vh, 560px); transform: translateY(calc(100% + 30px)); }
      .code-panel.open { transform: translateY(0); }
      #canvas { width: 100%; height: 100%; min-height: 0; touch-action: none; }
      .canvas-wrap { min-height: 0; overflow: hidden; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>

  <script>
  (() => {
    "use strict";

    const SVG_NS = "http://www.w3.org/2000/svg";
    const STORAGE_KEY = "diagram-editor-draft-v1";
    const AGENT_PREAMBLE = "%% 供 agent 閱讀：%% @comment A: 內容綁定節點；%% @comment A-->B: 內容綁定邊；其他 %% 行是文件註解。";
    const DEFAULT_SOURCE = `flowchart TD
  idea([Agent 提案])
  review{需要調整嗎？}
  done[貼回 Agent]
  idea --> review
  %% @comment idea-->review: 可在這裡補充希望 agent 注意的事
  review -->|需要| idea
  review -->|完成| done
  %% 直接點畫布元素，就能在右側加註解`;

    const ROUND_TRIP_SOURCE = `flowchart LR
%% 文件層級：涵蓋 v1 round-trip
A
B[方框]
%% @comment B: 保留這個方框
C(圓角)
D{菱形}
E([膠囊])
A -->|箭頭| B
%% @comment A-->B: 這是箭頭註解
B --- C
C -.-> D
D ==>|粗線| E
%% @comment D-->E: 這是粗箭頭註解
classDef future fill:#fff4c2,stroke:#875400
style E fill:#fff4c2`;

    const $ = (selector) => document.querySelector(selector);
    const code = $("#code");
    const canvas = $("#canvas");
    const edgesLayer = $("#edgesLayer");
    const nodesLayer = $("#nodesLayer");
    let uidCounter = 0;
    let toastTimer = null;
    let codeTimer = null;

    const state = {
      model: null,
      positions: new Map(),
      selected: { kind: "document" },
      drag: null,
      pan: null,
      tool: "select",
      pendingEdgeFrom: null,
      inspectorOpen: false,
      documentInspectorOpen: false,
      codeOpen: false,
      menuOpen: false,
      viewBox: { x: 0, y: 0, width: 1000, height: 700 }
    };

    function nextUid(prefix) {
      uidCounter += 1;
      return `${prefix}-${uidCounter}`;
    }

    function parseNodeLine(raw, line) {
      const patterns = [
        ["pill", /^(\s*)([A-Za-z_][\w-]*)\s*\(\[([^\]\r\n]*)\]\)\s*$/],
        ["rect", /^(\s*)([A-Za-z_][\w-]*)\s*\[([^\]\r\n]*)\]\s*$/],
        ["diamond", /^(\s*)([A-Za-z_][\w-]*)\s*\{([^}\r\n]*)\}\s*$/],
        ["round", /^(\s*)([A-Za-z_][\w-]*)\s*\(([^)\r\n]*)\)\s*$/]
      ];

      for (const [shape, regex] of patterns) {
        const match = raw.match(regex);
        if (match) {
          return {
            uid: nextUid("node"), kind: "node", id: match[2], label: match[3], shape,
            indent: match[1], raw, line, dirty: false, comments: []
          };
        }
      }

      const bare = raw.match(/^(\s*)([A-Za-z_][\w-]*)\s*$/);
      if (!bare) return null;
      return {
        uid: nextUid("node"), kind: "node", id: bare[2], label: bare[2], shape: "bare",
        indent: bare[1], raw, line, dirty: false, comments: []
      };
    }

    function parseEdgeLine(raw, line) {
      const match = raw.match(/^(\s*)([A-Za-z_][\w-]*)\s*(-->|---|-\.->|==>)\s*(?:\|([^|\r\n]*)\|\s*)?([A-Za-z_][\w-]*)\s*$/);
      if (!match) return null;
      return {
        uid: nextUid("edge"), kind: "edge", from: match[2], type: match[3], label: match[4] ?? "", to: match[5],
        indent: match[1], raw, line, dirty: false, comments: []
      };
    }

    function parseCommentTarget(target) {
      const edge = target.match(/^([A-Za-z_][\w-]*)\s*-->\s*([A-Za-z_][\w-]*)$/);
      if (edge) return { kind: "edge", from: edge[1], to: edge[2] };
      if (/^[A-Za-z_][\w-]*$/.test(target)) return { kind: "node", id: target };
      return null;
    }

    function targetMatches(record, target) {
      if (!target || record.kind !== target.kind) return false;
      if (target.kind === "node") return record.id === target.id;
      return record.from === target.from && record.to === target.to;
    }

    function unsupportedMessage(raw, line) {
      const trimmed = raw.trim();
      if (/^(subgraph|end\b|classDef\b|class\b|style\b|linkStyle\b|click\b)/i.test(trimmed)) {
        return `第 ${line} 行是 v1 不支援的 Mermaid 語法，已原樣保留。`;
      }
      return `第 ${line} 行無法安全解析，已原樣保留。`;
    }

    function parseSource(source) {
      const lines = String(source).replace(/\r\n?/g, "\n").split("\n");
      const records = [];
      const warnings = [];
      let direction = "TD";
      let headerSeen = false;

      lines.forEach((raw, index) => {
        const line = index + 1;
        const header = raw.match(/^(\s*)(flowchart|graph)\s+(TD|LR|BT|RL)\s*$/i);
        if (header && !headerSeen) {
          headerSeen = true;
          direction = header[3].toUpperCase();
          records.push({ uid: nextUid("header"), kind: "header", direction, indent: header[1], raw, line, dirty: false });
          return;
        }

        const structured = raw.match(/^(\s*)%%\s*@comment\s+([^:]+):\s?(.*)$/);
        if (structured) {
          records.push({
            uid: nextUid("comment"), kind: "structured-pending", targetRaw: structured[2].trim(),
            target: parseCommentTarget(structured[2].trim()), text: structured[3], indent: structured[1],
            raw, line, dirty: false
          });
          return;
        }

        const documentComment = raw.match(/^(\s*)%%(.*)$/);
        if (documentComment) {
          records.push({
            uid: nextUid("doc"), kind: "document-comment", text: documentComment[2].replace(/^\s?/, ""),
            indent: documentComment[1], raw, line, dirty: false
          });
          return;
        }

        const edge = parseEdgeLine(raw, line);
        if (edge) { records.push(edge); return; }

        const node = parseNodeLine(raw, line);
        if (node) { records.push(node); return; }

        if (raw.trim() === "") {
          records.push({ uid: nextUid("blank"), kind: "blank", raw, line });
          return;
        }

        records.push({ uid: nextUid("unknown"), kind: "unknown", raw, line });
        warnings.push(unsupportedMessage(raw, line));
      });

      if (!headerSeen) warnings.unshift("找不到 flowchart／graph 方向宣告；原文仍完整保留。第一次用 GUI 修改時會補上 flowchart TD。");

      const definitions = records.filter((record) => record.kind === "node" || record.kind === "edge");
      const resolved = [];
      let lastDefinition = null;

      for (const record of records) {
        if (record.kind === "structured-pending") {
          if (record.target && lastDefinition && targetMatches(lastDefinition, record.target)) {
            lastDefinition.comments.push(record);
            continue;
          }

          const matches = record.target ? definitions.filter((candidate) => targetMatches(candidate, record.target)) : [];
          if (matches.length === 1) {
            matches[0].comments.push(record);
            warnings.push(`第 ${record.line} 行的 @comment 不在定義後方；匯出時會移到 ${record.targetRaw} 後面。`);
            continue;
          }

          const reason = !record.target ? "註解 target 格式無法辨識" : matches.length > 1 ? "有多個可能的目標" : "找不到目標";
          resolved.push({ ...record, kind: "unknown" });
          warnings.push(`第 ${record.line} 行的 @comment ${reason}，已原樣保留而不猜測綁定。`);
          lastDefinition = null;
          continue;
        }

        resolved.push(record);
        if (record.kind === "node" || record.kind === "edge") lastDefinition = record;
        else lastDefinition = null;
      }

      const nodeCounts = new Map();
      for (const record of resolved) {
        if (record.kind !== "node") continue;
        nodeCounts.set(record.id, (nodeCounts.get(record.id) || 0) + 1);
      }
      for (const [id, count] of nodeCounts) {
        if (count > 1) warnings.push(`節點 ${id} 有 ${count} 個定義；GUI 只編輯第一個，其餘原文照常保留。`);
      }

      return { records: resolved, direction, warnings };
    }

    function serializeComment(comment, target, indent = "") {
      if (!comment.dirty && comment.raw != null) return comment.raw;
      return `${indent}%% @comment ${target}: ${comment.text}`;
    }

    function serializeRecord(record) {
      if (record.kind === "header") {
        return [record.dirty ? `${record.indent || ""}flowchart ${record.direction}` : record.raw];
      }
      if (record.kind === "node") {
        let line = record.raw;
        if (record.dirty) {
          const label = record.label || record.id;
          const syntax = record.shape === "bare" ? record.id
            : record.shape === "rect" ? `${record.id}[${label}]`
            : record.shape === "round" ? `${record.id}(${label})`
            : record.shape === "diamond" ? `${record.id}{${label}}`
            : `${record.id}([${label}])`;
          line = `${record.indent || ""}${syntax}`;
        }
        const target = record.id;
        return [line, ...record.comments.map((comment) => serializeComment(comment, target, record.indent || ""))];
      }
      if (record.kind === "edge") {
        const label = record.label ? `|${record.label}| ` : "";
        const line = record.dirty
          ? `${record.indent || ""}${record.from} ${record.type}${label || " "}${record.to}`
          : record.raw;
        const target = `${record.from}-->${record.to}`;
        return [line, ...record.comments.map((comment) => serializeComment(comment, target, record.indent || ""))];
      }
      if (record.kind === "document-comment") {
        return [record.dirty ? `${record.indent || ""}%%${record.text ? ` ${record.text}` : ""}` : record.raw];
      }
      return [record.raw ?? ""];
    }

    function serializeModel(model) {
      return model.records.flatMap(serializeRecord).join("\n");
    }

    function explicitNode(id) {
      return state.model.records.find((record) => record.kind === "node" && record.id === id) || null;
    }

    function graphNodes(model = state.model) {
      const nodes = [];
      const seen = new Set();
      for (const record of model.records) {
        if (record.kind !== "node" || seen.has(record.id)) continue;
        nodes.push(record);
        seen.add(record.id);
      }
      for (const edge of model.records.filter((record) => record.kind === "edge")) {
        for (const id of [edge.from, edge.to]) {
          if (seen.has(id)) continue;
          nodes.push({ uid: `virtual:${id}`, kind: "node", id, label: id, shape: "bare", comments: [], virtual: true });
          seen.add(id);
        }
      }
      return nodes;
    }

    function graphEdges(model = state.model) {
      return model.records.filter((record) => record.kind === "edge");
    }

    function nodeById(id) {
      return graphNodes().find((node) => node.id === id) || null;
    }

    function selectedRecord() {
      if (state.selected.kind === "document") return null;
      if (state.selected.kind === "node" && state.selected.id) return nodeById(state.selected.id);
      return state.model.records.find((record) => record.uid === state.selected.uid) || null;
    }

    function ensureHeader() {
      let header = state.model.records.find((record) => record.kind === "header");
      if (header) return header;
      header = { uid: nextUid("header"), kind: "header", direction: state.model.direction || "TD", indent: "", raw: "", dirty: true };
      state.model.records.unshift(header);
      return header;
    }

    function promoteVirtual(id) {
      const existing = explicitNode(id);
      if (existing) return existing;
      ensureHeader();
      const record = {
        uid: nextUid("node"), kind: "node", id, label: id, shape: "bare", comments: [],
        indent: "  ", raw: "", dirty: true
      };
      const firstEdge = state.model.records.findIndex((item) => item.kind === "edge");
      const insertAt = firstEdge >= 0 ? firstEdge : state.model.records.length;
      state.model.records.splice(insertAt, 0, record);
      state.selected = { kind: "node", id };
      return record;
    }

    function persistDraft(source) {
      try { localStorage.setItem(STORAGE_KEY, source); } catch (_) { /* file:// storage may be unavailable */ }
    }

    function loadSource(source, options = {}) {
      state.model = parseSource(source);
      if (code.value !== source) code.value = source;
      state.selected = { kind: "document" };
      state.inspectorOpen = false;
      state.documentInspectorOpen = false;
      state.pendingEdgeFrom = null;
      state.tool = "select";
      updateToolChrome();
      if (options.layout !== false) autoLayout(false);
      renderAll();
      if (options.save !== false) persistDraft(source);
    }

    function syncFromModel(options = {}) {
      const source = serializeModel(state.model);
      code.value = source;
      persistDraft(source);
      renderAll();
      if (options.layout) autoLayout(true);
    }

    function toast(message) {
      const el = $("#toast");
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
    }

    function showDialog(dialog) {
      if (typeof dialog.showModal === "function") dialog.showModal();
      else dialog.setAttribute("open", "");
    }

    function closeDialog(dialog) {
      if (typeof dialog.close === "function") dialog.close();
      else dialog.removeAttribute("open");
    }

    function closeMenu() {
      state.menuOpen = false;
      $("#menuPopover").classList.remove("open");
      $("#menuButton").setAttribute("aria-expanded", "false");
    }

    function renderWarnings() {
      const warnings = [...state.model.warnings];
      const pairCounts = new Map();
      for (const edge of graphEdges()) {
        const key = `${edge.from}-->${edge.to}`;
        pairCounts.set(key, (pairCounts.get(key) || 0) + 1);
      }
      for (const [key, count] of pairCounts) {
        if (count > 1) warnings.push(`${key} 有 ${count} 條邊；@comment 請緊跟目標邊，避免綁定不明。`);
      }

      const box = $("#warnings");
      if (!warnings.length) {
        box.classList.remove("show");
        box.replaceChildren();
        $("#codeToggle").classList.remove("has-warnings");
        return;
      }
      const shown = warnings.slice(0, 6);
      box.classList.add("show");
      $("#codeToggle").classList.add("has-warnings");
      box.innerHTML = `<strong>有 ${warnings.length} 個提醒；資料都還在。</strong><ul>${shown.map((warning) => `<li>${escapeHtml(warning)}</li>`).join("")}${warnings.length > shown.length ? `<li>另有 ${warnings.length - shown.length} 個提醒。</li>` : ""}</ul>`;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
      })[character]);
    }

    function autoLayout(shouldRender = true) {
      const nodes = graphNodes();
      const edges = graphEdges();
      const ids = nodes.map((node) => node.id);
      const indegree = new Map(ids.map((id) => [id, 0]));
      const adjacency = new Map(ids.map((id) => [id, []]));
      const level = new Map(ids.map((id) => [id, 0]));

      for (const edge of edges) {
        if (!indegree.has(edge.from) || !indegree.has(edge.to)) continue;
        adjacency.get(edge.from).push(edge.to);
        indegree.set(edge.to, indegree.get(edge.to) + 1);
      }

      const queue = ids.filter((id) => indegree.get(id) === 0);
      const visited = new Set();
      while (queue.length) {
        const id = queue.shift();
        if (visited.has(id)) continue;
        visited.add(id);
        for (const next of adjacency.get(id)) {
          level.set(next, Math.max(level.get(next), level.get(id) + 1));
          indegree.set(next, indegree.get(next) - 1);
          if (indegree.get(next) === 0) queue.push(next);
        }
      }

      const maxVisitedLevel = Math.max(0, ...[...visited].map((id) => level.get(id)));
      ids.filter((id) => !visited.has(id)).forEach((id, index) => level.set(id, maxVisitedLevel + 1 + Math.floor(index / 4)));

      const groups = new Map();
      for (const id of ids) {
        const depth = level.get(id);
        if (!groups.has(depth)) groups.set(depth, []);
        groups.get(depth).push(id);
      }

      const direction = state.model.direction || "TD";
      const depths = [...groups.keys()].sort((a, b) => a - b);
      const primaryStart = 105;
      const primaryEnd = direction === "TD" || direction === "BT" ? 595 : 895;
      const crossStart = 110;
      const crossEnd = direction === "TD" || direction === "BT" ? 890 : 590;

      depths.forEach((depth, depthIndex) => {
        const members = groups.get(depth);
        const primary = depths.length === 1 ? (primaryStart + primaryEnd) / 2 : primaryStart + (primaryEnd - primaryStart) * depthIndex / (depths.length - 1);
        members.forEach((id, memberIndex) => {
          const cross = members.length === 1 ? (crossStart + crossEnd) / 2 : crossStart + (crossEnd - crossStart) * memberIndex / (members.length - 1);
          let x = direction === "TD" || direction === "BT" ? cross : primary;
          let y = direction === "TD" || direction === "BT" ? primary : cross;
          if (direction === "BT") y = 700 - y;
          if (direction === "RL") x = 1000 - x;
          state.positions.set(id, { x, y });
        });
      });

      if (shouldRender) {
        renderCanvas();
        toast("已重新排版；拖曳座標不會寫進 Mermaid。 ");
      }
    }

    function nodeSize(node) {
      const length = Array.from(node.label || node.id).length;
      const width = Math.max(112, Math.min(230, 58 + length * 15 + (node.shape === "diamond" ? 26 : 0)));
      return { width, height: node.shape === "diamond" ? 82 : 64 };
    }

    function connectionPoints(fromNode, toNode) {
      const from = state.positions.get(fromNode.id) || { x: 0, y: 0 };
      const to = state.positions.get(toNode.id) || { x: 0, y: 0 };
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      const distance = Math.hypot(dx, dy) || 1;
      const ux = dx / distance;
      const uy = dy / distance;

      function radius(node, unitX, unitY) {
        const size = nodeSize(node);
        const rx = size.width / 2;
        const ry = size.height / 2;
        if (node.shape === "diamond") return 1 / (Math.abs(unitX) / rx + Math.abs(unitY) / ry || 1);
        return Math.min(rx / Math.max(Math.abs(unitX), .0001), ry / Math.max(Math.abs(unitY), .0001));
      }

      const startRadius = radius(fromNode, ux, uy);
      const endRadius = radius(toNode, ux, uy);
      return {
        x1: from.x + ux * startRadius,
        y1: from.y + uy * startRadius,
        x2: to.x - ux * endRadius,
        y2: to.y - uy * endRadius
      };
    }

    function svgElement(name, attributes = {}) {
      const element = document.createElementNS(SVG_NS, name);
      for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, String(value));
      return element;
    }

    function renderEdges() {
      edgesLayer.replaceChildren();
      for (const edge of graphEdges()) {
        const fromNode = nodeById(edge.from);
        const toNode = nodeById(edge.to);
        if (!fromNode || !toNode || !state.positions.has(edge.from) || !state.positions.has(edge.to)) continue;
        const point = connectionPoints(fromNode, toNode);
        const d = `M ${point.x1} ${point.y1} L ${point.x2} ${point.y2}`;
        const selected = state.selected.kind === "edge" && state.selected.uid === edge.uid;
        const group = svgElement("g", { role: "button", tabindex: "0", "aria-label": `連線 ${edge.from} 到 ${edge.to}` });
        const lineClass = ["edge-line", edge.type === "-.->" ? "dashed" : "", edge.type === "==>" ? "thick" : "", selected ? "selected" : ""].filter(Boolean).join(" ");
        const line = svgElement("path", { d, class: lineClass });
        if (edge.type !== "---") line.setAttribute("marker-end", selected ? "url(#arrowAccent)" : "url(#arrow)");
        const hit = svgElement("path", { d, class: "edge-hit" });
        group.append(line, hit);

        const midpoint = { x: (point.x1 + point.x2) / 2, y: (point.y1 + point.y2) / 2 };
        if (edge.label) {
          const width = Math.min(220, Math.max(44, Array.from(edge.label).length * 13 + 18));
          group.append(svgElement("rect", { x: midpoint.x - width / 2, y: midpoint.y - 13, width, height: 26, rx: 8, class: "edge-label-bg" }));
          const label = svgElement("text", { x: midpoint.x, y: midpoint.y, class: "edge-label" });
          label.textContent = edge.label;
          group.append(label);
        }

        if (edge.comments.length) group.append(makeCommentBadge(midpoint.x + 18, midpoint.y - 18, edge.comments.length));
        group.addEventListener("click", (event) => {
          event.stopPropagation();
          if (state.tool === "select" || state.tool === "comment") selectEdge(edge.uid, state.tool === "comment");
        });
        group.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") { event.preventDefault(); selectEdge(edge.uid); }
        });
        edgesLayer.append(group);
      }
    }

    function makeCommentBadge(x, y, count) {
      const group = svgElement("g", { class: "comment-badge", transform: `translate(${x} ${y})`, "aria-label": `${count} 則註解` });
      group.append(svgElement("circle", { r: 11 }));
      const text = svgElement("text", { x: 0, y: .5 });
      text.textContent = count > 9 ? "9+" : String(count);
      group.append(text);
      return group;
    }

    function renderNodes() {
      nodesLayer.replaceChildren();
      for (const node of graphNodes()) {
        if (!state.positions.has(node.id)) state.positions.set(node.id, { x: 500, y: 350 });
        const position = state.positions.get(node.id);
        const size = nodeSize(node);
        const selected = state.selected.kind === "node" && state.selected.id === node.id;
        const group = svgElement("g", {
          class: `svg-node${selected ? " selected" : ""}${state.pendingEdgeFrom === node.id ? " edge-origin" : ""}`,
          transform: `translate(${position.x} ${position.y})`, role: "button", tabindex: "0",
          "aria-label": `節點 ${node.id}，${node.label || node.id}`
        });

        let shape;
        if (node.shape === "diamond") {
          shape = svgElement("polygon", {
            points: `0,${-size.height / 2} ${size.width / 2},0 0,${size.height / 2} ${-size.width / 2},0`, class: "node-shape"
          });
        } else {
          const radius = node.shape === "pill" ? size.height / 2 : node.shape === "round" ? 16 : 7;
          shape = svgElement("rect", { x: -size.width / 2, y: -size.height / 2, width: size.width, height: size.height, rx: radius, class: "node-shape" });
        }
        group.append(shape);

        const label = svgElement("text", { x: 0, y: node.label && node.label !== node.id ? -4 : 0, class: "node-label" });
        label.textContent = node.label || node.id;
        group.append(label);
        if (node.label && node.label !== node.id) {
          const id = svgElement("text", { x: 0, y: 19, class: "node-id" });
          id.textContent = node.id;
          group.append(id);
        }
        if (node.comments.length) group.append(makeCommentBadge(size.width / 2 - 3, -size.height / 2 + 2, node.comments.length));

        group.addEventListener("pointerdown", (event) => startDrag(event, node.id, group));
        group.addEventListener("click", (event) => {
          event.stopPropagation();
          if (state.tool !== "select") return;
          if (!state.drag || !state.drag.moved) selectNode(node.id);
        });
        group.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") { event.preventDefault(); selectNode(node.id); }
        });
        nodesLayer.append(group);
      }
    }

    function renderCanvas() {
      renderEdges();
      renderNodes();
      $("#canvasSummary").textContent = `${graphNodes().length} 個節點 · ${graphEdges().length} 條邊`;
    }

    function populateNodeSelect(select, value) {
      select.replaceChildren();
      for (const node of graphNodes()) {
        const option = document.createElement("option");
        option.value = node.id;
        option.textContent = `${node.id} — ${node.label || node.id}`;
        option.selected = node.id === value;
        select.append(option);
      }
    }

    function renderInspector() {
      const inspector = $("#inspector");
      const documentSection = $("#documentInspector");
      const nodeSection = $("#nodeInspector");
      const edgeSection = $("#edgeInspector");
      const shouldOpen = state.inspectorOpen && (state.selected.kind !== "document" || state.documentInspectorOpen);
      inspector.classList.toggle("open", shouldOpen);
      documentSection.hidden = state.selected.kind !== "document";
      nodeSection.hidden = state.selected.kind !== "node";
      edgeSection.hidden = state.selected.kind !== "edge";

      if (state.selected.kind === "document") {
        $("#selectionSummary").textContent = "文件";
        $("#direction").value = state.model.direction || "TD";
        $("#documentComments").value = state.model.records
          .filter((record) => record.kind === "document-comment")
          .map((record) => record.text)
          .join("\n");
        $("#documentComments").setCustomValidity("");
        return;
      }

      const record = selectedRecord();
      if (!record) { state.selected = { kind: "document" }; renderInspector(); return; }

      if (state.selected.kind === "node") {
        $("#selectionSummary").textContent = `節點 ${record.id}`;
        $("#nodeId").textContent = record.id;
        $("#nodeLabel").value = record.label || record.id;
        $("#nodeLabel").setCustomValidity("");
        $("#nodeShape").value = record.shape;
        $("#nodeShape").setCustomValidity("");
        document.querySelectorAll(".shape-option").forEach((button) => button.classList.toggle("selected", button.dataset.shape === record.shape));
        $("#nodeComments").value = record.comments.map((comment) => comment.text).join("\n");
        $("#virtualNodeHint").hidden = !record.virtual;
      } else {
        $("#selectionSummary").textContent = `${record.from} → ${record.to}`;
        populateNodeSelect($("#edgeFrom"), record.from);
        populateNodeSelect($("#edgeTo"), record.to);
        $("#edgeType").value = record.type;
        document.querySelectorAll(".line-option").forEach((button) => button.classList.toggle("selected", button.dataset.line === record.type));
        $("#edgeLabel").value = record.label;
        $("#edgeLabel").setCustomValidity("");
        $("#edgeComments").value = record.comments.map((comment) => comment.text).join("\n");
        $("#edgeCommentHint").innerHTML = `輸出格式：<code>%% @comment ${escapeHtml(record.from)}--&gt;${escapeHtml(record.to)}: 內容</code>`;
      }
    }

    function renderAll() {
      renderWarnings();
      renderCanvas();
      renderInspector();
    }

    function revealInspector(documentMode = false) {
      state.inspectorOpen = true;
      state.documentInspectorOpen = documentMode;
      if (window.innerWidth <= 820 && state.codeOpen) {
        state.codeOpen = false;
        $("#codePanel").classList.remove("open");
        $("#codeToggle").setAttribute("aria-expanded", "false");
      }
    }

    function selectNode(id, focusComment = false) {
      state.selected = { kind: "node", id };
      revealInspector(false);
      renderAll();
      if (focusComment) requestAnimationFrame(() => $("#nodeComments").focus());
    }

    function selectEdge(uid, focusComment = false) {
      state.selected = { kind: "edge", uid };
      revealInspector(false);
      renderAll();
      if (focusComment) requestAnimationFrame(() => $("#edgeComments").focus());
    }

    function selectDocument(openInspector = false) {
      state.selected = { kind: "document" };
      if (openInspector) revealInspector(true);
      else { state.documentInspectorOpen = false; state.inspectorOpen = false; }
      renderAll();
      if (openInspector) requestAnimationFrame(() => $("#documentComments").focus());
    }

    function clientToSvg(clientX, clientY) {
      const point = canvas.createSVGPoint();
      point.x = clientX;
      point.y = clientY;
      return point.matrixTransform(canvas.getScreenCTM().inverse());
    }

    function applyViewBox() {
      const view = state.viewBox;
      canvas.setAttribute("viewBox", `${view.x} ${view.y} ${view.width} ${view.height}`);
    }

    function startDrag(event, id, group) {
      if (event.button != null && event.button !== 0) return;
      if (state.tool === "hand") return;
      event.stopPropagation();
      if (state.tool === "edge") { handleEdgeNode(id); return; }
      if (state.tool === "comment") { selectNode(id, true); return; }
      if (state.tool !== "select") return;
      const point = clientToSvg(event.clientX, event.clientY);
      const position = state.positions.get(id);
      state.selected = { kind: "node", id };
      revealInspector(false);
      nodesLayer.querySelectorAll(".svg-node").forEach((node) => node.classList.remove("selected"));
      group.classList.add("selected");
      renderEdges();
      renderInspector();
      state.drag = {
        id, group, startX: point.x, startY: point.y, originX: position.x, originY: position.y,
        moved: false, pointerId: event.pointerId
      };
    }

    document.addEventListener("pointermove", (event) => {
      if (state.pan && event.pointerId === state.pan.pointerId) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = state.viewBox.width / rect.width;
        const scaleY = state.viewBox.height / rect.height;
        state.viewBox.x = state.pan.originX - (event.clientX - state.pan.startX) * scaleX;
        state.viewBox.y = state.pan.originY - (event.clientY - state.pan.startY) * scaleY;
        applyViewBox();
        event.preventDefault();
        return;
      }
      if (!state.drag || event.pointerId !== state.drag.pointerId) return;
      const point = clientToSvg(event.clientX, event.clientY);
      const dx = point.x - state.drag.startX;
      const dy = point.y - state.drag.startY;
      if (Math.hypot(dx, dy) > 3) state.drag.moved = true;
      const x = Math.max(55, Math.min(945, state.drag.originX + dx));
      const y = Math.max(45, Math.min(655, state.drag.originY + dy));
      state.positions.set(state.drag.id, { x, y });
      state.drag.group.setAttribute("transform", `translate(${x} ${y})`);
      renderEdges();
      event.preventDefault();
    }, { passive: false });

    document.addEventListener("pointerup", (event) => {
      if (state.pan && event.pointerId === state.pan.pointerId) {
        state.pan = null;
        return;
      }
      if (!state.drag || event.pointerId !== state.drag.pointerId) return;
      const moved = state.drag.moved;
      state.drag = null;
      if (moved) toast("位置只保留在目前畫布，不會寫進 Mermaid。 ");
    });

    function updateElementComments(record, value) {
      const texts = value.split(/\r?\n/).map((text) => text.trim()).filter(Boolean);
      record.comments = texts.map((text, index) => {
        const existing = record.comments[index];
        if (existing && existing.text === text) return existing;
        return { uid: nextUid("comment"), kind: "structured-comment", text, raw: "", dirty: true };
      });
      record.dirty = record.dirty || false;
    }

    function invalidNodeLabel(label, shape) {
      const closing = { rect: "]", round: ")", diamond: "}", pill: "]" }[shape];
      return closing && label.includes(closing) ? `這個形狀的文字不能包含 ${closing}；v1 不會猜測 Mermaid 跳脫語法。` : "";
    }

    function retargetEdge(edge, endpoint, nodeId) {
      edge[endpoint] = nodeId;
      edge.dirty = true;
      edge.comments.forEach((comment) => { comment.dirty = true; });
    }

    function updateDocumentComments(value) {
      const texts = value.split(/\r?\n/).map((text) => text.trim()).filter(Boolean);
      const existing = state.model.records.filter((record) => record.kind === "document-comment");
      const remove = new Set(existing.slice(texts.length).map((record) => record.uid));
      state.model.records = state.model.records.filter((record) => !remove.has(record.uid));

      texts.slice(0, existing.length).forEach((text, index) => {
        const record = existing[index];
        if (!remove.has(record.uid) && record.text !== text) { record.text = text; record.dirty = true; }
      });

      if (texts.length > existing.length) {
        ensureHeader();
        let insertAt = state.model.records.reduce((last, record, index) => record.kind === "document-comment" ? index + 1 : last, -1);
        if (insertAt < 0) insertAt = state.model.records.findIndex((record) => record.kind === "header") + 1;
        const additions = texts.slice(existing.length).map((text) => ({
          uid: nextUid("doc"), kind: "document-comment", text, indent: "", raw: "", dirty: true
        }));
        state.model.records.splice(insertAt, 0, ...additions);
      }
    }

    function updateToolChrome() {
      document.querySelectorAll("[data-tool]").forEach((button) => {
        const active = button.dataset.tool === state.tool;
        button.classList.toggle("selected", active);
        button.setAttribute("aria-pressed", String(active));
      });
      canvas.className.baseVal = `tool-${state.tool}`;
      const hints = {
        select: "點選物件編輯；拖曳只改目前畫布，不會寫進 Mermaid。",
        hand: "拖曳空白處平移畫布。",
        rect: "點一下空白處放置方框。",
        diamond: "點一下空白處放置菱形。",
        round: "點一下空白處放置圓角節點。",
        pill: "點一下空白處放置膠囊節點。",
        edge: state.pendingEdgeFrom ? `已選 ${state.pendingEdgeFrom}；再點一個節點完成連線。` : "依序點兩個節點建立連線。",
        comment: "點物件加註解；點空白處加文件註解。"
      };
      $("#toolHint").textContent = hints[state.tool];
    }

    function setTool(tool) {
      state.tool = tool;
      if (tool !== "edge") state.pendingEdgeFrom = null;
      updateToolChrome();
      renderCanvas();
    }

    function addNodeAt(shape, position) {
      ensureHeader();
      const used = new Set(graphNodes().map((node) => node.id));
      let number = 1;
      while (used.has(`N${number}`)) number += 1;
      const id = `N${number}`;
      const record = {
        uid: nextUid("node"), kind: "node", id, label: `新節點 ${number}`, shape, comments: [],
        indent: "  ", raw: "", dirty: true
      };
      const lastNode = state.model.records.reduce((last, item, index) => item.kind === "node" ? index : last, -1);
      const headerIndex = state.model.records.findIndex((item) => item.kind === "header");
      state.model.records.splice(lastNode >= 0 ? lastNode + 1 : headerIndex + 1, 0, record);
      state.positions.set(id, { x: position.x, y: position.y });
      state.selected = { kind: "node", id };
      revealInspector(false);
      state.tool = "select";
      updateToolChrome();
      syncFromModel();
      requestAnimationFrame(() => { $("#nodeLabel").focus(); $("#nodeLabel").select(); });
    }

    function addEdgeBetween(from, to) {
      ensureHeader();
      const record = {
        uid: nextUid("edge"), kind: "edge", from, to, type: "-->", label: "", comments: [],
        indent: "  ", raw: "", dirty: true
      };
      const lastDefinition = state.model.records.reduce((last, item, index) => item.kind === "node" || item.kind === "edge" ? index : last, -1);
      state.model.records.splice(lastDefinition + 1, 0, record);
      state.selected = { kind: "edge", uid: record.uid };
      revealInspector(false);
      state.pendingEdgeFrom = null;
      state.tool = "select";
      updateToolChrome();
      syncFromModel();
      toast(`${from} → ${to} 已建立。`);
    }

    function handleEdgeNode(id) {
      if (!state.pendingEdgeFrom) {
        state.pendingEdgeFrom = id;
        updateToolChrome();
        renderCanvas();
        return;
      }
      addEdgeBetween(state.pendingEdgeFrom, id);
    }

    function handleCanvasPointerDown(event) {
      if (event.button != null && event.button !== 0) return;
      if (state.tool === "hand") {
        state.pan = {
          pointerId: event.pointerId, startX: event.clientX, startY: event.clientY,
          originX: state.viewBox.x, originY: state.viewBox.y
        };
        return;
      }
      if (event.target !== canvas) return;
      const shapes = new Set(["rect", "diamond", "round", "pill"]);
      if (shapes.has(state.tool)) {
        addNodeAt(state.tool, clientToSvg(event.clientX, event.clientY));
        return;
      }
      if (state.tool === "comment") {
        selectDocument(true);
        return;
      }
      if (state.tool === "edge" && state.pendingEdgeFrom) {
        state.pendingEdgeFrom = null;
        updateToolChrome();
        renderCanvas();
        return;
      }
      selectDocument(false);
    }

    function deleteNode() {
      const node = selectedRecord();
      if (!node) return;
      const incident = graphEdges().filter((edge) => edge.from === node.id || edge.to === node.id);
      const message = node.virtual
        ? `節點 ${node.id} 沒有獨立定義。要刪除它相連的 ${incident.length} 條支援範圍內連線嗎？未知語法原文不會變。`
        : `要刪除節點 ${node.id} 和相連的 ${incident.length} 條支援範圍內連線嗎？未知語法原文不會變。`;
      if (!confirm(message)) return;
      const remove = new Set(incident.map((edge) => edge.uid));
      if (!node.virtual) remove.add(node.uid);
      state.model.records = state.model.records.filter((record) => !remove.has(record.uid));
      state.positions.delete(node.id);
      state.selected = { kind: "document" };
      state.inspectorOpen = false;
      autoLayout(false);
      syncFromModel();
    }

    function deleteEdge() {
      const edge = selectedRecord();
      if (!edge || !confirm(`要刪除 ${edge.from} 到 ${edge.to} 的這條連線嗎？`)) return;
      state.model.records = state.model.records.filter((record) => record.uid !== edge.uid);
      state.selected = { kind: "document" };
      state.inspectorOpen = false;
      autoLayout(false);
      syncFromModel();
    }

    function extractMermaidFence(text) {
      const match = String(text).match(/```mermaid[^\n]*\n([\s\S]*?)```/i);
      return match ? match[1].replace(/\s+$/, "") : null;
    }

    async function handleFile(file) {
      const text = await file.text();
      const isMarkdown = /\.md$/i.test(file.name) || /```mermaid/i.test(text);
      if (isMarkdown) {
        const mermaid = extractMermaidFence(text);
        if (mermaid == null) { toast("這份 Markdown 找不到 mermaid code fence；目前內容沒有被取代。 "); return; }
        loadSource(mermaid);
      } else {
        loadSource(text);
      }
      toast(`已載入 ${file.name}`);
    }

    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (_) { /* use local fallback */ }

      const helper = document.createElement("textarea");
      helper.value = text;
      helper.setAttribute("readonly", "");
      helper.style.position = "fixed";
      helper.style.opacity = "0";
      document.body.append(helper);
      helper.select();
      let copied = false;
      try { copied = document.execCommand("copy"); } catch (_) { copied = false; }
      helper.remove();
      return copied;
    }

    async function copyOrShow(text, successMessage) {
      if (await copyText(text)) { toast(successMessage); return; }
      $("#exportText").value = text;
      showDialog($("#exportDialog"));
      $("#exportText").focus();
      $("#exportText").select();
    }

    function withAgentPreamble(source) {
      const lines = source.split("\n").filter((line) => line !== AGENT_PREAMBLE);
      const headerIndex = lines.findIndex((line) => /^\s*(flowchart|graph)\s+(TD|LR|BT|RL)\s*$/i.test(line));
      lines.splice(headerIndex >= 0 ? headerIndex + 1 : 0, 0, AGENT_PREAMBLE);
      return lines.join("\n");
    }

    function runRoundTripTest() {
      const first = serializeModel(parseSource(ROUND_TRIP_SOURCE));
      const second = serializeModel(parseSource(first));
      const unknownsPreserved = ["classDef future fill:#fff4c2,stroke:#875400", "style E fill:#fff4c2"]
        .every((line) => first.includes(line) && second.includes(line));
      const retargetModel = parseSource("flowchart TD\nA --> B\n%% @comment A-->B: 跟著邊移動\nC");
      const retargetedEdge = retargetModel.records.find((record) => record.kind === "edge");
      retargetEdge(retargetedEdge, "from", "C");
      const retargetedSource = serializeModel(retargetModel);
      const reparsedRetarget = parseSource(retargetedSource);
      const reparsedEdge = reparsedRetarget.records.find((record) => record.kind === "edge");
      const commentRetargeted = retargetedSource.includes("%% @comment C-->B: 跟著邊移動")
        && reparsedEdge.from === "C" && reparsedEdge.to === "B"
        && reparsedEdge.comments.length === 1 && reparsedEdge.comments[0].text === "跟著邊移動";
      return {
        pass: first === second && unknownsPreserved && commentRetargeted,
        source: ROUND_TRIP_SOURCE,
        first,
        second,
        unknownsPreserved,
        commentRetargeted
      };
    }

    document.querySelectorAll("[data-tool]").forEach((button) => button.addEventListener("click", () => setTool(button.dataset.tool)));
    $("#autoLayout").addEventListener("click", () => autoLayout(true));
    $("#menuButton").addEventListener("click", () => {
      state.menuOpen = !state.menuOpen;
      $("#menuPopover").classList.toggle("open", state.menuOpen);
      $("#menuButton").setAttribute("aria-expanded", String(state.menuOpen));
    });
    $("#openImport").addEventListener("click", () => {
      closeMenu();
      $("#importText").value = code.value;
      showDialog($("#importDialog"));
    });
    $("#loadFile").addEventListener("click", () => { closeMenu(); $("#fileInput").click(); });
    $("#fileInput").addEventListener("change", async (event) => {
      const [file] = event.target.files;
      if (file) await handleFile(file);
      event.target.value = "";
    });
    $("#copyMermaid").addEventListener("click", () => { closeMenu(); copyOrShow(serializeModel(state.model), "Mermaid 已複製。 "); });
    $("#copyAgent").addEventListener("click", () => copyOrShow(withAgentPreamble(serializeModel(state.model)), "已加入註解慣例並複製，可直接貼給 agent。 "));

    $("#documentSettings").addEventListener("click", () => {
      closeMenu();
      selectDocument(true);
    });
    $("#codeToggle").addEventListener("click", () => {
      state.codeOpen = !state.codeOpen;
      if (state.codeOpen && window.innerWidth <= 820) {
        state.inspectorOpen = false;
        renderInspector();
      }
      $("#codePanel").classList.toggle("open", state.codeOpen);
      $("#codeToggle").setAttribute("aria-expanded", String(state.codeOpen));
      if (state.codeOpen) requestAnimationFrame(() => code.focus());
    });
    $("#codeClose").addEventListener("click", () => {
      state.codeOpen = false;
      $("#codePanel").classList.remove("open");
      $("#codeToggle").setAttribute("aria-expanded", "false");
    });
    $("#inspectorClose").addEventListener("click", () => {
      state.inspectorOpen = false;
      state.documentInspectorOpen = false;
      renderInspector();
    });
    document.addEventListener("pointerdown", (event) => {
      if (!state.menuOpen) return;
      if ($("#menuPopover").contains(event.target) || $("#menuButton").contains(event.target)) return;
      closeMenu();
    });

    code.addEventListener("input", () => {
      persistDraft(code.value);
      clearTimeout(codeTimer);
      codeTimer = setTimeout(() => loadSource(code.value), 260);
    });

    canvas.addEventListener("pointerdown", handleCanvasPointerDown);
    canvas.addEventListener("dblclick", (event) => {
      if (event.target === canvas && state.tool === "select") addNodeAt("rect", clientToSvg(event.clientX, event.clientY));
    });
    document.querySelectorAll("[data-close]").forEach((button) => button.addEventListener("click", () => closeDialog($(`#${button.dataset.close}`))));
    $("#importForm").addEventListener("submit", (event) => {
      event.preventDefault();
      loadSource($("#importText").value);
      closeDialog($("#importDialog"));
      toast("已匯入文字；原草稿已更新。 ");
    });

    document.querySelectorAll(".shape-option").forEach((button) => button.addEventListener("click", () => {
      $("#nodeShape").value = button.dataset.shape;
      $("#nodeShape").dispatchEvent(new Event("change", { bubbles: true }));
    }));
    document.querySelectorAll(".line-option").forEach((button) => button.addEventListener("click", () => {
      $("#edgeType").value = button.dataset.line;
      $("#edgeType").dispatchEvent(new Event("change", { bubbles: true }));
    }));

    document.addEventListener("keydown", (event) => {
      const tag = document.activeElement?.tagName;
      const editing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || $("#importDialog").open || $("#exportDialog").open;
      if (editing) return;
      const tools = { "1": "select", "2": "hand", "3": "rect", "4": "diamond", "5": "round", "6": "pill", "7": "edge", "8": "comment" };
      if (tools[event.key]) { event.preventDefault(); setTool(tools[event.key]); return; }
      if (event.code === "Space" && !event.repeat) {
        event.preventDefault();
        state.toolBeforeSpace = state.tool;
        setTool("hand");
        return;
      }
      if ((event.key === "Delete" || event.key === "Backspace") && state.selected.kind !== "document") {
        event.preventDefault();
        state.selected.kind === "node" ? deleteNode() : deleteEdge();
        return;
      }
      if (event.key === "Enter" && state.selected.kind !== "document") {
        event.preventDefault();
        (state.selected.kind === "node" ? $("#nodeLabel") : $("#edgeLabel")).focus();
        return;
      }
      if (event.key === "Escape") {
        closeMenu();
        state.codeOpen = false;
        state.inspectorOpen = false;
        $("#codePanel").classList.remove("open");
        setTool("select");
        renderInspector();
      }
    });
    document.addEventListener("keyup", (event) => {
      if (event.code === "Space" && state.toolBeforeSpace) {
        const previous = state.toolBeforeSpace;
        state.toolBeforeSpace = null;
        setTool(previous);
      }
    });

    $("#direction").addEventListener("change", (event) => {
      const header = ensureHeader();
      header.direction = event.target.value;
      header.dirty = true;
      state.model.direction = event.target.value;
      autoLayout(false);
      syncFromModel();
    });
    $("#documentComments").addEventListener("change", (event) => {
      const hasStructuredPrefix = event.target.value.split(/\r?\n/).some((line) => line.trimStart().startsWith("@comment"));
      event.target.setCustomValidity(hasStructuredPrefix ? "文件註解不能以 @comment 開頭；請改在節點或連線的註解欄輸入。" : "");
      if (hasStructuredPrefix) { event.target.reportValidity(); return; }
      updateDocumentComments(event.target.value);
      syncFromModel();
    });

    $("#nodeLabel").addEventListener("input", (event) => {
      let node = selectedRecord();
      if (!node) return;
      const nextShape = node.shape === "bare" && event.target.value !== node.id ? "rect" : node.shape;
      const invalid = invalidNodeLabel(event.target.value, nextShape);
      event.target.setCustomValidity(invalid);
      if (invalid) { event.target.reportValidity(); return; }
      if (node.virtual) node = promoteVirtual(node.id);
      node.label = event.target.value;
      node.shape = nextShape;
      node.dirty = true;
      syncFromModel();
    });
    $("#nodeShape").addEventListener("change", (event) => {
      let node = selectedRecord();
      if (!node) return;
      const nextShape = event.target.value;
      if (nextShape === "bare" && node.label !== node.id) {
        event.target.value = node.shape;
        toast("預設節點不能保留自訂文字；請先把文字改成節點 ID，原內容沒有變。 ");
        renderInspector();
        return;
      }
      const nextLabel = nextShape === "bare" ? node.id : node.label;
      const invalid = invalidNodeLabel(nextLabel, nextShape);
      event.target.setCustomValidity(invalid);
      if (invalid) { event.target.reportValidity(); return; }
      if (node.virtual) node = promoteVirtual(node.id);
      node.shape = nextShape;
      node.label = nextLabel;
      node.dirty = true;
      syncFromModel();
    });
    $("#nodeComments").addEventListener("change", (event) => {
      let node = selectedRecord();
      if (!node) return;
      if (node.virtual) node = promoteVirtual(node.id);
      updateElementComments(node, event.target.value);
      syncFromModel();
    });
    $("#deleteNode").addEventListener("click", deleteNode);

    $("#edgeFrom").addEventListener("change", (event) => { retargetEdge(selectedRecord(), "from", event.target.value); syncFromModel(); });
    $("#edgeTo").addEventListener("change", (event) => { retargetEdge(selectedRecord(), "to", event.target.value); syncFromModel(); });
    $("#edgeType").addEventListener("change", (event) => { const edge = selectedRecord(); edge.type = event.target.value; edge.dirty = true; syncFromModel(); });
    $("#edgeLabel").addEventListener("input", (event) => {
      const invalid = event.target.value.includes("|") ? "連線標籤不能包含 |；它是 Mermaid 標籤的分隔符號。" : "";
      event.target.setCustomValidity(invalid);
      if (invalid) { event.target.reportValidity(); return; }
      const edge = selectedRecord();
      edge.label = event.target.value;
      edge.dirty = true;
      syncFromModel();
    });
    $("#edgeComments").addEventListener("change", (event) => { const edge = selectedRecord(); updateElementComments(edge, event.target.value); syncFromModel(); });
    $("#deleteEdge").addEventListener("click", deleteEdge);

    window.__diagramEditor = Object.freeze({
      parse: parseSource,
      serialize: serializeModel,
      withAgentPreamble,
      extractMermaidFence,
      runRoundTripTest
    });

    let initial = DEFAULT_SOURCE;
    let restored = false;
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) { initial = saved; restored = true; }
    } catch (_) { /* local storage unavailable */ }
    applyViewBox();
    updateToolChrome();
    loadSource(initial, { save: false });
    if (restored) setTimeout(() => toast("已還原這台瀏覽器上次的草稿。 "), 120);
  })();
  </script>
</body>
</html>
