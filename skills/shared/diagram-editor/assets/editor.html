<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mermaid 流程圖編輯器</title>
<style>
:root {
  --ink: #1e1e1e; --sub: #7a7a8c; --island: #ffffff;
  --violet: #6965db; --violet-soft: #e0dfff; --violet-faint: #f1f0ff;
  --line: #e5e5ef; --canvas: #fdfdfd; --warn: #b45309;
  --hand: "Chalkboard SE", "Bradley Hand", "Comic Sans MS", "Segoe Print", "PingFang TC", cursive;
  --shadow: 0 0 0 1px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.10);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 13px/1.5 -apple-system, "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
  color: var(--ink); background: var(--canvas); overflow: hidden;
}
#svg { position: fixed; inset: 0; width: 100vw; height: 100dvh; touch-action: none; user-select: none; -webkit-user-select: none; }
#svg.tool-hand { cursor: grab; }
#svg.tool-shape { cursor: crosshair; }
#svg.panning { cursor: grabbing; }
.island {
  position: fixed; background: var(--island); border-radius: 10px; box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 2px; padding: 4px; z-index: 10;
}
#toolbar { top: 12px; left: 50%; transform: translateX(-50%); }
#toolbar .sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 4px; }
.toolBtn {
  position: relative; width: 38px; height: 36px; border: none; background: none; border-radius: 8px;
  cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--ink);
}
.toolBtn:hover { background: var(--violet-faint); }
.toolBtn.active { background: var(--violet-soft); }
.toolBtn svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.toolBtn .kbd { position: absolute; right: 4px; bottom: 2px; font-size: 9px; color: var(--sub); }
#topRight { top: 12px; right: 12px; }
#topRight select {
  font: inherit; font-size: 12px; border: none; background: none; padding: 6px 4px; border-radius: 8px; cursor: pointer; color: var(--ink);
}
#topRight select:hover { background: var(--violet-faint); }
#zoomIsland { bottom: 12px; left: 12px; }
#zoomIsland button, #histIsland button {
  border: none; background: none; font: inherit; padding: 6px 10px; border-radius: 8px; cursor: pointer; color: var(--ink);
}
#zoomIsland button:hover, #histIsland button:hover { background: var(--violet-faint); }
#zoomPct { min-width: 48px; text-align: center; font-size: 12px; color: var(--sub); }
#histIsland { bottom: 12px; left: 190px; }
#hintBar {
  position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
  font-size: 12px; color: var(--sub); pointer-events: none; z-index: 5; text-align: center;
}
/* 屬性面板 */
#props {
  position: fixed; top: 64px; left: 12px; width: 208px; max-height: calc(100dvh - 140px);
  overflow-y: auto; background: var(--island); border-radius: 10px; box-shadow: var(--shadow);
  padding: 10px 12px; z-index: 10; display: none;
}
#props.open { display: block; }
#props h4 { margin: 10px 0 5px; font-size: 11px; font-weight: 600; color: var(--sub); }
#props h4:first-child { margin-top: 0; }
.swRow { display: flex; gap: 5px; flex-wrap: wrap; }
.sw {
  width: 24px; height: 24px; border-radius: 5px; border: 1px solid rgba(0,0,0,.12); cursor: pointer; padding: 0;
  position: relative;
}
.sw.none { background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0/10px 10px; }
.sw.picked { outline: 2px solid var(--violet); outline-offset: 1px; }
.optRow { display: flex; gap: 5px; }
.optBtn {
  height: 28px; min-width: 32px; padding: 0 6px; border: none; border-radius: 6px; background: #f4f4f9;
  cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--ink);
}
.optBtn:hover { background: var(--violet-faint); }
.optBtn.picked { background: var(--violet-soft); }
.optBtn svg { width: 22px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
#props input[type=text], #props textarea {
  width: 100%; font: inherit; font-size: 12px; padding: 5px 7px; border: 1px solid var(--line);
  border-radius: 6px; background: #fff; color: var(--ink);
}
#props textarea { resize: vertical; min-height: 44px; }
.actRow { display: flex; gap: 5px; margin-top: 10px; }
.actRow button {
  flex: 1; font: inherit; font-size: 12px; padding: 5px 0; border: 1px solid var(--line);
  border-radius: 6px; background: #fff; cursor: pointer; color: var(--ink);
}
.actRow button:hover { border-color: var(--violet); }
.actRow .danger { color: #c92a2a; }
#pId { width: 100%; margin-bottom: 2px; }
/* 程式碼抽屜 */
#drawer {
  position: fixed; top: 60px; right: 12px; bottom: 60px; width: 380px; max-width: calc(100vw - 24px);
  background: var(--island); border-radius: 10px; box-shadow: var(--shadow); z-index: 12;
  display: none; flex-direction: column; padding: 12px; gap: 8px;
}
#drawer.open { display: flex; }
#drawer h4 { margin: 0; font-size: 11px; font-weight: 600; color: var(--sub); }
#drawer .row { display: flex; gap: 6px; flex-wrap: wrap; }
#drawer .row button {
  font: inherit; font-size: 12px; padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px;
  background: #fff; cursor: pointer; color: var(--ink);
}
#drawer .row button:hover { border-color: var(--violet); }
#drawer .row button.primary { background: var(--violet); border-color: var(--violet); color: #fff; }
#code {
  flex: 1; min-height: 100px; font: 12px/1.55 ui-monospace, Menlo, Consolas, monospace;
  border: 1px solid var(--line); border-radius: 6px; padding: 8px; white-space: pre; overflow: auto;
  resize: none; color: var(--ink);
}
#code.dirty { border-color: var(--warn); }
#dirtyHint { font-size: 11px; color: var(--warn); min-height: 14px; }
#docComments { font: inherit; font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; resize: vertical; min-height: 36px; }
#unknownBox {
  font: 11px/1.5 ui-monospace, Menlo, monospace; background: #fdf6ec; border: 1px solid #ecd9b8;
  border-radius: 6px; padding: 6px 8px; white-space: pre-wrap; word-break: break-all; color: #7a5b17;
  max-height: 110px; overflow: auto;
}
/* 行內文字編輯 */
#inlineEdit {
  position: fixed; z-index: 30; display: none; text-align: center; border: 1.5px dashed var(--violet);
  border-radius: 4px; background: rgba(255,255,255,.92); color: var(--ink); font-family: var(--hand);
  outline: none; padding: 2px 6px;
}
#toasts { position: fixed; bottom: 56px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 6px; max-width: min(560px, 92vw); }
.toast { background: #2b3240; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow); cursor: pointer; }
.toast.warn { background: #8a5a12; }
/* SVG */
.node { cursor: move; }
.edgeHit { stroke: transparent; stroke-width: 18; fill: none; cursor: pointer; }
.hachure { pointer-events: none; }
.nodeText { font-family: var(--hand); pointer-events: none; paint-order: stroke; stroke: rgba(255,255,255,.82); stroke-width: 3.5px; }
.edgeLabel { font-family: var(--hand); paint-order: stroke; stroke: var(--canvas); stroke-width: 5px; pointer-events: none; }
.node, .edge { transition: opacity .28s ease; }
#svg.dimming .node, #svg.dimming .edge { opacity: .14; }
#svg.dimming .spot { opacity: 1; }
.cbadge { cursor: help; }
.cbadge path { transition: stroke .15s ease, fill .15s ease; }
.cbadge:hover path { stroke: var(--violet); }
.cbadge:hover circle { fill: var(--violet); }
#commentTip {
  position: fixed; z-index: 40; display: none; max-width: 300px;
  background: #fff; border-radius: 9px; box-shadow: var(--shadow);
  padding: 8px 11px; font-family: var(--hand); font-size: 14px; line-height: 1.45;
  white-space: pre-wrap; word-break: break-word; color: var(--ink); pointer-events: none;
}
.selBox { fill: none; stroke: var(--violet); stroke-width: 1.2; stroke-dasharray: 4 4; pointer-events: none; }
.selDot { fill: #fff; stroke: var(--violet); stroke-width: 1.2; pointer-events: none; }
@media (max-width: 760px) {
  #toolbar { top: auto; bottom: 58px; max-width: 96vw; flex-wrap: wrap; justify-content: center; }
  #props { top: auto; bottom: 156px; left: 8px; right: 8px; width: auto; max-height: 34dvh; }
  #drawer { top: 56px; bottom: 156px; left: 8px; right: 8px; width: auto; }
  #hintBar { display: none; }
  #histIsland { left: auto; right: 12px; }
}
</style>
</head>
<body>
<svg id="svg" preserveAspectRatio="xMidYMid meet"></svg>

<div class="island" id="toolbar">
  <button class="toolBtn" data-tool="hand" title="移動畫布 — H">
    <svg viewBox="0 0 24 24"><path d="M7 11.5V6.5a1.6 1.6 0 0 1 3.2 0V11m0-5.5V4.2a1.6 1.6 0 0 1 3.2 0V11m0-6v1.3a1.6 1.6 0 0 1 3.2 0V13c0 4-2.5 7-6.2 7-3 0-4.6-1.6-6.4-5l-1.5-3c-.5-1 .8-2.3 2-1.4L7 12.5"/></svg>
  </button>
  <button class="toolBtn" data-tool="select" title="選取／移動 — V 或 1">
    <svg viewBox="0 0 24 24"><path d="M6 3.5 18 12l-5.5 1L15 19.5l-2.6 1.2-2.6-6.4-4 4.2z"/></svg><span class="kbd">1</span>
  </button>
  <div class="sep"></div>
  <button class="toolBtn" data-tool="rect" title="方框節點 — R 或 2(畫布上點一下放置)">
    <svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="13" rx="1.5"/></svg><span class="kbd">2</span>
  </button>
  <button class="toolBtn" data-tool="diamond" title="菱形判斷 — D 或 3">
    <svg viewBox="0 0 24 24"><path d="M12 3.5 21 12l-9 8.5L3 12z"/></svg><span class="kbd">3</span>
  </button>
  <button class="toolBtn" data-tool="stadium" title="膠囊(起訖點)— O 或 4">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="7" width="17" height="10" rx="5"/></svg><span class="kbd">4</span>
  </button>
  <div class="sep"></div>
  <button class="toolBtn" data-tool="arrow" title="箭頭連線 — A 或 5(從節點拖到另一個節點;拖到空白會順手長新節點)">
    <svg viewBox="0 0 24 24"><path d="M4 19 19 5m0 0h-6m6 0v6"/></svg><span class="kbd">5</span>
  </button>
  <button class="toolBtn" data-tool="line" title="無箭頭連線 — L 或 6">
    <svg viewBox="0 0 24 24"><path d="M4.5 18.5 19.5 5.5"/></svg><span class="kbd">6</span>
  </button>
</div>

<div class="island" id="topRight">
  <button class="toolBtn" id="btnLayout" title="自動排版(重算所有位置)">
    <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4m0 0-6 4m6-4 6 4"/></svg>
  </button>
  <select id="selDir" title="流程方向">
    <option value="TD">上→下</option>
    <option value="LR">左→右</option>
    <option value="BT">下→上</option>
    <option value="RL">右→左</option>
  </select>
  <select id="selRough" title="筆觸(只影響畫面,不會匯出)">
    <option value="0">筆觸:工整</option>
    <option value="1" selected>筆觸:手繪</option>
    <option value="2">筆觸:潦草</option>
  </select>
  <button class="toolBtn" id="btnDrawer" title="Mermaid 程式碼／匯入匯出">
    <svg viewBox="0 0 24 24"><path d="m9 8-4 4 4 4m6-8 4 4-4 4"/></svg>
  </button>
</div>

<div class="island" id="zoomIsland">
  <button id="btnZoomOut" title="縮小">−</button>
  <span id="zoomPct" title="點一下回 100%" style="cursor:pointer">100%</span>
  <button id="btnZoomIn" title="放大">＋</button>
  <button id="btnFit" title="縮放到剛好看到全圖">⤢</button>
</div>
<div class="island" id="histIsland">
  <button id="btnUndo" title="復原 — Cmd/Ctrl+Z">↶</button>
  <button id="btnRedo" title="重做 — Cmd/Ctrl+Shift+Z">↷</button>
</div>

<div id="hintBar">雙擊空白處新增節點,雙擊節點改字;拖曳位置只是畫面,Mermaid 沒有座標欄位,匯出不含版面</div>

<div id="props">
  <div id="propsNode">
    <h4>節點 ID</h4>
    <input type="text" id="pId" spellcheck="false">
    <h4>形狀</h4>
    <div class="optRow" id="pShape">
      <button class="optBtn" data-shape="rect" title="方框 [文字]"><svg viewBox="0 0 24 20"><rect x="3" y="4" width="18" height="12" rx="1.5"/></svg></button>
      <button class="optBtn" data-shape="round" title="圓角 (文字)"><svg viewBox="0 0 24 20"><rect x="3" y="4" width="18" height="12" rx="5"/></svg></button>
      <button class="optBtn" data-shape="stadium" title="膠囊 ([文字])"><svg viewBox="0 0 24 20"><rect x="3" y="4" width="18" height="12" rx="6"/></svg></button>
      <button class="optBtn" data-shape="diamond" title="菱形 {文字}"><svg viewBox="0 0 24 20"><path d="M12 2.5 22 10l-10 7.5L2 10z"/></svg></button>
      <button class="optBtn" data-shape="plain" title="純 ID(無框)" style="font-size:11px">Aa</button>
    </div>
    <h4>框線</h4>
    <div class="swRow" id="pStroke"></div>
    <h4>背景(斜線填充)</h4>
    <div class="swRow" id="pFill"></div>
    <h4>線寬</h4>
    <div class="optRow" id="pWidth">
      <button class="optBtn" data-w="1" title="細"><svg viewBox="0 0 24 18"><path d="M4 9h16" stroke-width="1"/></svg></button>
      <button class="optBtn" data-w="2" title="中"><svg viewBox="0 0 24 18"><path d="M4 9h16" stroke-width="2.4"/></svg></button>
      <button class="optBtn" data-w="4" title="粗"><svg viewBox="0 0 24 18"><path d="M4 9h16" stroke-width="4"/></svg></button>
    </div>
    <h4>線條</h4>
    <div class="optRow" id="pDash">
      <button class="optBtn" data-dash="" title="實線"><svg viewBox="0 0 24 18"><path d="M4 9h16"/></svg></button>
      <button class="optBtn" data-dash="6 6" title="虛線"><svg viewBox="0 0 24 18"><path d="M4 9h16" stroke-dasharray="4 3"/></svg></button>
    </div>
  </div>
  <div id="propsEdge">
    <h4>線型</h4>
    <div class="optRow" id="pEType">
      <button class="optBtn" data-etype="arrow" title="實線箭頭 --&gt;"><svg viewBox="0 0 24 18"><path d="M3 9h14m0 0-4-4m4 4-4 4"/></svg></button>
      <button class="optBtn" data-etype="line" title="無箭頭 ---"><svg viewBox="0 0 24 18"><path d="M3 9h17"/></svg></button>
      <button class="optBtn" data-etype="dotted" title="虛線箭頭 -.-&gt;"><svg viewBox="0 0 24 18"><path d="M3 9h14" stroke-dasharray="3 3"/><path d="m17 9-4-4m4 4-4 4"/></svg></button>
      <button class="optBtn" data-etype="thick" title="粗箭頭 ==&gt;"><svg viewBox="0 0 24 18"><path d="M3 9h14m0 0-4-4m4 4-4 4" stroke-width="3"/></svg></button>
    </div>
    <h4>顏色</h4>
    <div class="swRow" id="pEStroke"></div>
  </div>
  <div>
    <h4 id="pLabelTitle">文字</h4>
    <input type="text" id="pLabel" spellcheck="false">
    <h4>註解(匯出成 %% @comment,AI 讀得到)</h4>
    <textarea id="pComment" placeholder="想對它說的話…"></textarea>
    <div class="actRow">
      <button id="pDup">複製一份</button>
      <button id="pReverse">反轉方向</button>
      <button id="pDelete" class="danger">刪除</button>
    </div>
  </div>
</div>

<div id="drawer">
  <div class="row">
    <button id="btnImport">匯入檔案</button>
    <button id="btnCopy">複製 Mermaid</button>
    <button id="btnExportAgent">匯出給 agent</button>
    <button id="btnNew">新圖</button>
    <input type="file" id="fileInput" accept=".mmd,.md,.txt,.mermaid" hidden>
  </div>
  <h4>Mermaid 程式碼(可直接貼上)</h4>
  <textarea id="code" spellcheck="false"></textarea>
  <div id="dirtyHint"></div>
  <div class="row"><button id="btnApply" class="primary">套用程式碼(Cmd/Ctrl+Enter)</button></div>
  <h4>文件層級註解(每行一則)</h4>
  <textarea id="docComments" placeholder="整張圖的說明、給 AI 的整體指示…"></textarea>
  <div id="unknownWrap" hidden>
    <h4>子集外語法(唯讀,匯出時原樣吐回)</h4>
    <div id="unknownBox"></div>
  </div>
</div>

<input id="inlineEdit" autocomplete="off">
<div id="commentTip"></div>
<div id="toasts"></div>

<script>
'use strict';
// ===== core-start =====
// 純函式區:Mermaid flowchart 子集的 parse / serialize,不碰 DOM。
// 不吞資料原則:看不懂的行以 unknown 進 doc.stream,匯出時在原位逐字吐回。

const EDGE_TOKENS = { '-.->': 'dotted', '==>': 'thick', '-->': 'arrow', '---': 'line' };
const TYPE_TOKEN = { dotted: '-.->', thick: '==>', arrow: '-->', line: '---' };
const RESERVED_RE = /^(end|subgraph|direction|classDef|class|style|linkStyle|click|accTitle|accDescr)\b/;
const PREAMBLE_PREFIX = '[diagram-editor]';

// doc.stream 是逐行的陳述序列(node/edge 為物件參照,unknown/doccomment 為原文),
// 匯出照 stream 原順序走——unknown 行留在原位,%%{init}%% 這類位置敏感的指令才不會失效。
function emptyDoc() {
  return { header: 'flowchart', dir: 'TD', nodes: [], edges: [], stream: [] };
}
function docCommentLines(doc) { return doc.stream.filter(s => s.kind === 'doccomment').map(s => s.text); }
function unknownLines(doc) { return doc.stream.filter(s => s.kind === 'unknown').map(s => s.text); }
function unknownHasEdgeTokens(doc) { return doc.stream.some(s => s.kind === 'unknown' && /(-\.->|==>|-->|---)/.test(s.text)); }

// style/linkStyle 的屬性字串:只在讀寫個別 key 時解析,保留未知 key 原樣
function parseProps(raw) {
  return (raw || '').split(',').map(s => s.trim()).filter(Boolean).map(kv => {
    const i = kv.indexOf(':');
    return i < 0 ? [kv, ''] : [kv.slice(0, i).trim(), kv.slice(i + 1).trim()];
  });
}
function buildProps(arr) { return arr.map(([k, v]) => v ? k + ':' + v : k).join(','); }
function getProp(raw, key) {
  const hits = parseProps(raw).filter(p => p[0] === key);
  return hits.length ? hits[hits.length - 1][1] : null; // 重複 key 時 mermaid 生效最後一個
}
function setProp(raw, key, value) {
  let arr = parseProps(raw);
  const hits = arr.filter(p => p[0] === key);
  if (value == null) arr = arr.filter(p => p[0] !== key);
  else if (hits.length) hits[hits.length - 1][1] = value;
  else arr.push([key, value]);
  return arr.length ? buildProps(arr) : null;
}

// 讀一個節點參照:`A`、`A[文字]`、`A(文字)`、`A([文字])`、`A{文字}`;文字可用雙引號包住。
function scanNodeRef(s) {
  const m = s.match(/^\s*([A-Za-z0-9_]+)/);
  if (!m) return null;
  const id = m[1];
  let rest = s.slice(m[0].length);
  const wraps = [['([', '])', 'stadium'], ['[', ']', 'rect'], ['(', ')', 'round'], ['{', '}', 'diamond']];
  for (const [open, close, shape] of wraps) {
    if (!rest.startsWith(open)) continue;
    const inner = rest.slice(open.length);
    let text, after;
    if (inner.startsWith('"')) {
      const q = inner.indexOf('"', 1);
      if (q < 0) return null;
      text = inner.slice(1, q).replace(/#quot;/g, '"');
      after = inner.slice(q + 1);
    } else {
      const c = inner.indexOf(close[0]);
      if (c < 0) return null;
      text = inner.slice(0, c).trim();
      after = inner.slice(c);
    }
    if (!after.startsWith(close)) return null;
    return { id, shape, label: text, rest: after.slice(close.length) };
  }
  return { id, shape: 'plain', label: null, rest };
}

// 讀一個邊 token:`-->`、`---`、`-.->`、`==>`,可帶 `|標籤|`。
function scanEdge(s) {
  const m = s.match(/^\s*(-\.->|==>|-->|---)/);
  if (!m) return null;
  let rest = s.slice(m[0].length);
  let label = null;
  const lm = rest.match(/^\s*\|([^|]*)\|/);
  if (lm) { label = lm[1].trim(); rest = rest.slice(lm[0].length); }
  return { type: EDGE_TOKENS[m[1]], label, rest };
}

// 解析一行陳述:單一節點定義,或 A --> B --> C 這樣的鏈。整行讀不完就回 null(交給 unknown)。
function parseFlowLine(line) {
  if (RESERVED_RE.test(line)) return null;
  const first = scanNodeRef(line);
  if (!first) return null;
  const nodes = [{ id: first.id, shape: first.shape, label: first.label }];
  const edges = [];
  let prev = first, rest = first.rest;
  while (rest.trim() !== '') {
    const e = scanEdge(rest);
    if (!e) return null;
    const n = scanNodeRef(e.rest);
    if (!n) return null;
    nodes.push({ id: n.id, shape: n.shape, label: n.label });
    edges.push({ from: prev.id, to: n.id, type: e.type, label: e.label, comment: '', style: null });
    prev = n; rest = n.rest;
  }
  return { nodes, edges };
}

function mergeNode(doc, n) {
  const ex = doc.nodes.find(x => x.id === n.id);
  if (!ex) {
    const node = { id: n.id, shape: n.label != null ? n.shape : 'plain', label: n.label, comment: '', style: null };
    doc.nodes.push(node);
    return { node, isNew: true };
  }
  if (n.label != null) { ex.shape = n.shape; ex.label = n.label; }
  return { node: ex, isNew: false };
}

function parseMermaid(text) {
  const doc = emptyDoc();
  const warnings = [];
  // @comment / style / linkStyle 先收著,整份讀完再對回節點與邊;
  // 每筆 pending 在 stream 裡佔一個 placeholder,解析成功就移除、失敗就原位轉回 unknown。
  const pending = [];
  const lines = text.split(/\r?\n/);
  let headerSeen = false;
  let adjEdges = null; // 「緊跟在邊定義行後」的相鄰性:平行邊的 @comment 靠這個綁定,不猜
  let i = 0;
  while (i < lines.length) {
    const line = lines[i].trim();
    const lineNo = i + 1;
    i++;
    if (!line) continue;
    if (!headerSeen) {
      const hm = line.match(/^(flowchart|graph)(?:\s+(TD|TB|LR|BT|RL))?\s*$/);
      if (hm) {
        doc.header = hm[1];
        doc.dir = !hm[2] || hm[2] === 'TB' ? 'TD' : hm[2]; // 沒寫方向時 Mermaid 預設 TB
        headerSeen = true;
        continue;
      }
    }
    if (line.startsWith('%%{')) { // %%{init:...}%% 指令不是註解,原位原樣保留(位置影響語意)
      doc.stream.push({ kind: 'unknown', text: line });
      warnings.push('第 ' + lineNo + ' 行是 %%{…}%% 指令,不在支援範圍,已原樣保留');
      adjEdges = null;
      continue;
    }
    if (line.startsWith('%%')) {
      const body = line.replace(/^%%\s*/, '');
      if (body.startsWith(PREAMBLE_PREFIX)) continue; // 「匯出給 agent」的說明行,重匯入時丟棄避免越疊越多
      const cm = body.match(/^@comment\s+([^:]+):\s*(.*)$/);
      if (!cm) { doc.stream.push({ kind: 'doccomment', text: body }); adjEdges = null; continue; }
      const target = cm[1].trim();
      const em = target.match(/^([A-Za-z0-9_]+)\s*(-\.->|==>|-->|---)\s*([A-Za-z0-9_]+)$/);
      const ph = { kind: 'pending' };
      if (em) {
        doc.stream.push(ph);
        pending.push({ kind: 'edgeComment', from: em[1], type: EDGE_TOKENS[em[2]], to: em[3], text: cm[2], raw: line, lineNo, ph, adj: adjEdges });
      } else if (/^[A-Za-z0-9_]+$/.test(target)) {
        doc.stream.push(ph);
        pending.push({ kind: 'nodeComment', id: target, text: cm[2], raw: line, lineNo, ph });
      } else {
        doc.stream.push({ kind: 'unknown', text: line });
        warnings.push('第 ' + lineNo + ' 行的 @comment 目標「' + target + '」看不懂,已原樣保留');
      }
      continue; // @comment 行不重設相鄰性,同一條邊可以連寫多行註解
    }
    const stm = line.match(/^style\s+([A-Za-z0-9_]+)\s+(.+)$/);
    if (stm) { // style 行也不重設相鄰性:匯出時它夾在定義行與 @comment 之間
      const ph = { kind: 'pending' };
      doc.stream.push(ph);
      pending.push({ kind: 'nodeStyle', id: stm[1], props: stm[2].trim(), raw: line, lineNo, ph });
      continue;
    }
    const lsm = line.match(/^linkStyle\s+(\d+)\s+(.+)$/);
    if (lsm) {
      const ph = { kind: 'pending' };
      doc.stream.push(ph);
      pending.push({ kind: 'edgeStyle', index: +lsm[1], props: lsm[2].trim(), raw: line, lineNo, ph });
      continue;
    }
    if (/^subgraph\b/.test(line)) { // subgraph 整塊(含裡面的節點)原樣保留,避免拆散語意
      const block = [line];
      let depth = 1;
      while (i < lines.length && depth > 0) {
        const l2 = lines[i].trim();
        if (/^subgraph\b/.test(l2)) depth++;
        else if (/^end$/.test(l2)) depth--;
        if (l2) block.push(l2); // 空行不收,未閉合的 subgraph 才不會每輪 round-trip 多長空白
        i++;
      }
      doc.stream.push({ kind: 'unknown', text: block.join('\n') });
      warnings.push('第 ' + lineNo + ' 行起的 subgraph 不在支援範圍,已原樣保留(裡面的節點不會出現在畫布上)');
      adjEdges = null;
      continue;
    }
    const parsed = parseFlowLine(line);
    if (parsed) {
      for (const n of parsed.nodes) {
        const r = mergeNode(doc, n);
        if (r.isNew) doc.stream.push({ kind: 'node', ref: r.node });
      }
      for (const e of parsed.edges) {
        doc.edges.push(e);
        doc.stream.push({ kind: 'edge', ref: e });
      }
      adjEdges = parsed.edges;
    } else {
      doc.stream.push({ kind: 'unknown', text: line });
      warnings.push('第 ' + lineNo + ' 行不在支援子集,已原樣保留:' + (line.length > 50 ? line.slice(0, 50) + '…' : line));
      adjEdges = null;
    }
  }
  // placeholder 收尾:解析成功 → 從 stream 移除(內容會跟著目標一起匯出);
  // 失敗 → 原位轉回 unknown,逐字保留。
  const resolve = (ph, keepAsUnknown, raw) => {
    const idx = doc.stream.indexOf(ph);
    if (idx < 0) return;
    if (keepAsUnknown) doc.stream[idx] = { kind: 'unknown', text: raw };
    else doc.stream.splice(idx, 1);
  };
  // mermaid 的 linkStyle 索引數的是「全部」的邊,含 subgraph 內與子集外語法定義的;
  // unknown 裡只要有邊 token,我們的邊計數就不可信,linkStyle 全數原樣保留、不掛到邊上。
  const unknownHasEdges = unknownHasEdgeTokens(doc);
  for (const p of pending) {
    if (p.kind === 'edgeStyle' && unknownHasEdges) {
      resolve(p.ph, true, p.raw);
      warnings.push('第 ' + p.lineNo + ' 行的 linkStyle 已原樣保留:子集外語法裡也有邊,索引對不準,不敢亂掛');
      continue;
    }
    if (p.kind === 'nodeComment' || p.kind === 'nodeStyle') {
      const n = doc.nodes.find(x => x.id === p.id);
      if (!n) {
        resolve(p.ph, true, p.raw);
        warnings.push('第 ' + p.lineNo + ' 行找不到節點 ' + p.id + ',已原樣保留');
      } else if (p.kind === 'nodeComment') {
        n.comment = n.comment ? n.comment + '\n' + p.text : p.text;
        resolve(p.ph, false);
      } else {
        n.style = n.style ? n.style + ',' + p.props : p.props;
        resolve(p.ph, false);
      }
    } else if (p.kind === 'edgeStyle') {
      const e = doc.edges[p.index];
      if (!e) {
        resolve(p.ph, true, p.raw);
        warnings.push('第 ' + p.lineNo + ' 行的 linkStyle 指到不存在的第 ' + p.index + ' 條邊,已原樣保留');
      } else {
        e.style = e.style ? e.style + ',' + p.props : p.props;
        resolve(p.ph, false);
      }
    } else { // edgeComment:相鄰優先;全域唯一才綁;多條同端點的邊不猜
      let target = null;
      if (p.adj) {
        const near = p.adj.filter(e => e.from === p.from && e.to === p.to);
        target = near.find(e => e.type === p.type) || near[0] || null;
      }
      if (!target) {
        const cands = doc.edges.filter(e => e.from === p.from && e.to === p.to);
        if (cands.length === 1) target = cands[0];
        else if (!cands.length) {
          resolve(p.ph, true, p.raw);
          warnings.push('第 ' + p.lineNo + ' 行的註解找不到 ' + p.from + '→' + p.to + ' 這條邊,已原樣保留');
          continue;
        } else {
          resolve(p.ph, true, p.raw);
          warnings.push('第 ' + p.lineNo + ' 行的註解有 ' + cands.length + ' 條 ' + p.from + '→' + p.to + ' 的邊都可能是目標,不猜,已原樣保留(要綁定就把註解移到那條邊的定義行正下方)');
          continue;
        }
      }
      target.comment = target.comment ? target.comment + '\n' + p.text : p.text;
      resolve(p.ph, false);
    }
  }
  return { doc, warnings };
}

function serializeLabel(text) {
  if (text === '' || /[\[\]{}()"|]/.test(text) || /^\s|\s$/.test(text)) {
    return '"' + text.replace(/"/g, '#quot;') + '"';
  }
  return text;
}

function serializeNode(n) {
  if (n.shape === 'plain' || n.label == null) return n.id;
  const w = { rect: ['[', ']'], round: ['(', ')'], stadium: ['([', '])'], diamond: ['{', '}'] }[n.shape];
  return n.id + w[0] + serializeLabel(n.label) + w[1];
}

function serializeEdge(e) {
  const lbl = e.label ? '|' + e.label + '|' : '';
  return e.from + ' ' + TYPE_TOKEN[e.type] + lbl + ' ' + e.to;
}

function serializeMermaid(doc) {
  const out = [doc.header + ' ' + doc.dir];
  const emitNode = n => {
    out.push('  ' + serializeNode(n));
    if (n.style) out.push('  style ' + n.id + ' ' + n.style);
    if (n.comment) for (const l of n.comment.split('\n')) out.push('  %% @comment ' + n.id + ': ' + l);
  };
  const emitEdge = e => {
    out.push('  ' + serializeEdge(e));
    if (e.comment) for (const l of e.comment.split('\n')) out.push('  %% @comment ' + e.from + TYPE_TOKEN[e.type] + e.to + ': ' + l);
  };
  // 照 stream 原順序走:unknown / 文件註解留在原位;被刪掉的節點與邊直接跳過
  const seen = new Set();
  for (const s of doc.stream) {
    if (s.kind === 'node') {
      if (!doc.nodes.includes(s.ref) || seen.has(s.ref)) continue;
      seen.add(s.ref);
      emitNode(s.ref);
    } else if (s.kind === 'edge') {
      if (!doc.edges.includes(s.ref) || seen.has(s.ref)) continue;
      seen.add(s.ref);
      emitEdge(s.ref);
    } else if (s.kind === 'doccomment') {
      out.push('  %% ' + s.text);
    } else if (s.kind === 'unknown') {
      for (const l of s.text.split('\n')) out.push('  ' + l);
    }
  }
  // GUI 新增、還沒進 stream 的節點與邊補在後面
  for (const n of doc.nodes) if (!seen.has(n)) emitNode(n);
  for (const e of doc.edges) if (!seen.has(e)) emitEdge(e);
  // linkStyle 依索引指邊,要等所有邊都宣告完才出現,索引照目前順序重算
  doc.edges.forEach((e, i) => { if (e.style) out.push('  linkStyle ' + i + ' ' + e.style); });
  return out.join('\n') + '\n';
}

// 內建 round-trip 自測:改過 parse/serialize 後,在瀏覽器 console 跑
// window.__diagramEditor.runRoundTripTest(),pass 必須是 true 才能交付。
const ROUND_TRIP_SOURCE = [
  'flowchart TD',
  '  %%{init: {"theme":"neutral"}}%%',
  '  %% 文件層級註解',
  '  %% @comment A-->B: 不相鄰又有多條候選,不該被綁定',
  '  A[方框]',
  '  style A fill:#ffc9c9,stroke:#e03131',
  '  %% @comment A: 節點註記',
  '  B(圓角)',
  '  C{菱形?}',
  '  D([膠囊])',
  '  E',
  '  classDef hot fill:#f96',
  '  A -->|是| B',
  '  %% @comment A-->B: 第一條邊的註記',
  '  B --- C',
  '  C -.-> D',
  '  D ==> E',
  '  E --> E',
  '  A --> B',
  '  %% @comment A-->B: 第二條平行邊的註記',
  '  linkStyle 0 stroke:#f00',
  '  subgraph S1[子圖]',
  '    X --> Y',
  '  end',
].join('\n') + '\n';

function runRoundTripTest() {
  const r1 = parseMermaid(ROUND_TRIP_SOURCE);
  const e1 = serializeMermaid(r1.doc);
  const e2 = serializeMermaid(parseMermaid(e1).doc);
  const e3 = serializeMermaid(parseMermaid(e2).doc);
  const lines = e1.split('\n').map(l => l.trim());
  const d = r1.doc;
  const abEdges = d.edges.filter(e => e.from === 'A' && e.to === 'B');
  const checks = {
    '冪等:E(P(E(P(x)))) === E(P(x))(嚴格相等)': e1 === e2 && e2 === e3,
    'init 指令留在原位(標頭後、節點前)': lines.indexOf('%%{init: {"theme":"neutral"}}%%') === 1
      && lines.indexOf('%%{init: {"theme":"neutral"}}%%') < lines.indexOf('A[方框]'),
    'classDef 原位保留(E 之後、第一條邊之前)': lines.indexOf('classDef hot fill:#f96') > lines.indexOf('E')
      && lines.indexOf('classDef hot fill:#f96') < lines.indexOf('A -->|是| B'),
    'subgraph 逐字保留': ['subgraph S1[子圖]', 'X --> Y', 'end'].every(l => lines.includes(l)),
    '節點註解綁定': d.nodes.find(n => n.id === 'A').comment === '節點註記',
    '平行邊註解靠相鄰性各綁各的': abEdges.length === 2
      && abEdges[0].comment === '第一條邊的註記' && abEdges[1].comment === '第二條平行邊的註記',
    '不相鄰多候選的註解不猜:原位保留+警告': lines.indexOf('%% @comment A-->B: 不相鄰又有多條候選,不該被綁定') === 3
      && abEdges.every(e => !e.comment.includes('不該被綁定'))
      && r1.warnings.some(w => w.includes('不猜')),
    'style 掛回節點': d.nodes.find(n => n.id === 'A').style === 'fill:#ffc9c9,stroke:#e03131',
    'linkStyle 防護:unknown 有邊時原樣保留不亂掛': d.edges.every(e => !e.style)
      && lines.includes('linkStyle 0 stroke:#f00'),
    '五種節點形狀都在': ['rect', 'round', 'diamond', 'stadium', 'plain'].every(s => d.nodes.some(n => n.shape === s)),
    '四種邊型別都在': ['arrow', 'line', 'dotted', 'thick'].every(t => d.edges.some(e => e.type === t)),
  };
  return { pass: Object.values(checks).every(Boolean), checks, first: e1, second: e2 };
}

function agentPreamble() {
  return '%% ' + PREAMBLE_PREFIX + ' 註解慣例:「%% @comment 節點ID: 文字」是綁定節點的人工註記,「%% @comment 起點-->終點: 文字」綁定該條邊(緊跟在對應定義行後);其他 %% 行是文件層級註解。請把這些註記當作人類標給 AI 的重點說明。';
}

// 簡單分層排版(Sugiyama 精簡版):longest-path 分層 + 重心法排序。
// measure(node) 要回 {w, h}。回傳 Map(id -> {x, y})。
function autoLayout(doc, measure) {
  const pos = new Map();
  const nodes = doc.nodes;
  const n = nodes.length;
  if (!n) return pos;
  const index = new Map(nodes.map((nd, i) => [nd.id, i]));
  const edges = doc.edges.filter(e => index.has(e.from) && index.has(e.to) && e.from !== e.to);
  const layer = new Array(n).fill(0);
  for (let pass = 0; pass < n; pass++) { // Bellman-Ford 式鬆弛,層數上限 n,有環也會停
    let changed = false;
    for (const e of edges) {
      const a = index.get(e.from), b = index.get(e.to);
      if (layer[b] < layer[a] + 1 && layer[a] + 1 <= n) { layer[b] = layer[a] + 1; changed = true; }
    }
    if (!changed) break;
  }
  const byLayer = new Map();
  nodes.forEach((nd, i) => {
    if (!byLayer.has(layer[i])) byLayer.set(layer[i], []);
    byLayer.get(layer[i]).push(i);
  });
  const layerList = [...byLayer.keys()].sort((a, b) => a - b).map(k => byLayer.get(k));
  const inN = nodes.map(() => []), outN = nodes.map(() => []);
  for (const e of edges) {
    outN[index.get(e.from)].push(index.get(e.to));
    inN[index.get(e.to)].push(index.get(e.from));
  }
  const order = new Map();
  layerList.forEach(l => l.forEach((v, k) => order.set(v, k)));
  function bary(v, down) {
    const nb = down ? inN[v] : outN[v];
    if (!nb.length) return order.get(v);
    return nb.reduce((s, u) => s + order.get(u), 0) / nb.length;
  }
  for (let sweep = 0; sweep < 4; sweep++) {
    const down = sweep % 2 === 0;
    const seq = down ? layerList : [...layerList].slice().reverse();
    for (const l of seq) {
      l.sort((a, b) => bary(a, down) - bary(b, down));
      l.forEach((v, k) => order.set(v, k));
    }
  }
  const horizontal = doc.dir === 'LR' || doc.dir === 'RL'; // 層的推進軸是水平
  const sizes = nodes.map(nd => measure(nd));
  const LAYER_GAP = 90, NODE_GAP = 40;
  let v = 0;
  for (const l of layerList) {
    const thick = Math.max(...l.map(i => horizontal ? sizes[i].w : sizes[i].h));
    const spread = l.reduce((s, i) => s + (horizontal ? sizes[i].h : sizes[i].w), 0) + NODE_GAP * (l.length - 1);
    let u = -spread / 2;
    for (const i of l) {
      const su = horizontal ? sizes[i].h : sizes[i].w;
      const cu = u + su / 2, cv = v + thick / 2;
      const x = horizontal ? cv : cu;
      const y = horizontal ? cu : cv;
      pos.set(nodes[i].id, { x: doc.dir === 'RL' ? -x : x, y: doc.dir === 'BT' ? -y : y });
      u += su + NODE_GAP;
    }
    v += thick + LAYER_GAP;
  }
  return pos;
}
// ===== core-end =====

// ---------- 手繪風渲染(rough.js 精神的迷你實作) ----------
function hash32(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let ROUGH = 1; // 0 工整 / 1 手繪 / 2 潦草(全域檢視偏好,不匯出)

function jit(rnd, amt) { return (rnd() - 0.5) * 2 * amt * ROUGH; }

// 一段手繪線:兩道略偏的三次曲線;工整模式退回單一直線
function roughSeg(x1, y1, x2, y2, rnd, out) {
  if (!ROUGH) { out.push(`M ${x1} ${y1} L ${x2} ${y2}`); return; }
  const len = Math.hypot(x2 - x1, y2 - y1);
  const end = Math.min(2, len * 0.02) + 0.5;
  const mid = Math.min(2.6, len * 0.025) + 0.6;
  for (let p = 0; p < 2; p++) {
    const sx = x1 + jit(rnd, end), sy = y1 + jit(rnd, end);
    const ex = x2 + jit(rnd, end), ey = y2 + jit(rnd, end);
    const c1x = sx + (ex - sx) * 0.35 + jit(rnd, mid), c1y = sy + (ey - sy) * 0.35 + jit(rnd, mid);
    const c2x = sx + (ex - sx) * 0.65 + jit(rnd, mid), c2y = sy + (ey - sy) * 0.65 + jit(rnd, mid);
    out.push(`M ${sx} ${sy} C ${c1x} ${c1y} ${c2x} ${c2y} ${ex} ${ey}`);
  }
}

function roughPolyPath(points, rnd) {
  const out = [];
  for (let i = 0; i < points.length; i++) {
    const [x1, y1] = points[i], [x2, y2] = points[(i + 1) % points.length];
    roughSeg(x1, y1, x2, y2, rnd, out);
  }
  return out.join(' ');
}

function roughRoundRectPath(x, y, w, h, r, rnd) {
  r = Math.min(r, w / 2, h / 2);
  const out = [];
  roughSeg(x + r, y, x + w - r, y, rnd, out);
  roughSeg(x + w, y + r, x + w, y + h - r, rnd, out);
  roughSeg(x + w - r, y + h, x + r, y + h, rnd, out);
  roughSeg(x, y + h - r, x, y + r, rnd, out);
  if (r > 0) {
    const passes = ROUGH ? 2 : 1;
    for (let p = 0; p < passes; p++) {
      const j = () => jit(rnd, 0.7);
      out.push(`M ${x + w - r + j()} ${y + j()} A ${r} ${r} 0 0 1 ${x + w + j()} ${y + r + j()}`);
      out.push(`M ${x + w + j()} ${y + h - r + j()} A ${r} ${r} 0 0 1 ${x + w - r + j()} ${y + h + j()}`);
      out.push(`M ${x + r + j()} ${y + h + j()} A ${r} ${r} 0 0 1 ${x + j()} ${y + h - r + j()}`);
      out.push(`M ${x + j()} ${y + r + j()} A ${r} ${r} 0 0 1 ${x + r + j()} ${y + j()}`);
    }
  }
  return out.join(' ');
}

// 手繪二次曲線(邊用):兩道略偏的 Q
function roughQuadPath(ax, ay, cx, cy, bx, by, rnd) {
  if (!ROUGH) return `M ${ax} ${ay} Q ${cx} ${cy} ${bx} ${by}`;
  const out = [];
  for (let p = 0; p < 2; p++) {
    out.push(`M ${ax + jit(rnd, 1)} ${ay + jit(rnd, 1)} Q ${cx + jit(rnd, 2.4)} ${cy + jit(rnd, 2.4)} ${bx + jit(rnd, 1)} ${by + jit(rnd, 1)}`);
  }
  return out.join(' ');
}

// 斜線填充(hachure):45° 平行線,用 clipPath 裁進形狀
function hachurePath(x, y, w, h, rnd) {
  const gap = 8;
  const out = [];
  for (let d = -h; d < w; d += gap) {
    const x1 = x + d, y1 = y, x2 = x + d + h, y2 = y + h;
    out.push(`M ${x1 + jit(rnd, 1.2)} ${y1 + jit(rnd, 1.2)} L ${x2 + jit(rnd, 1.2)} ${y2 + jit(rnd, 1.2)}`);
  }
  return out.join(' ');
}

// 形狀的「乾淨」外框路徑(給 clipPath 與點擊範圍用)
function cleanShapePath(shape, x, y, w, h) {
  if (shape === 'diamond') {
    const cx = x + w / 2, cy = y + h / 2;
    return `M ${cx} ${y} L ${x + w} ${cy} L ${cx} ${y + h} L ${x} ${cy} Z`;
  }
  const r = shape === 'stadium' ? h / 2 : shape === 'round' ? 12 : 3;
  return `M ${x + r} ${y} H ${x + w - r} A ${r} ${r} 0 0 1 ${x + w} ${y + r} V ${y + h - r} A ${r} ${r} 0 0 1 ${x + w - r} ${y + h} H ${x + r} A ${r} ${r} 0 0 1 ${x} ${y + h - r} V ${y + r} A ${r} ${r} 0 0 1 ${x + r} ${y} Z`;
}

// ---------- 應用層 ----------
const $ = id => document.getElementById(id);
const svgEl = $('svg'), codeEl = $('code');
const DRAFT_KEY = 'diagram-editor-draft';
const ROUGH_KEY = 'diagram-editor-rough';
const STROKES = ['#1e1e1e', '#e03131', '#2f9e44', '#1971c2', '#f08c00'];
const FILLS = [null, '#ffc9c9', '#b2f2bb', '#a5d8ff', '#ffec99'];
const SAMPLE = `flowchart TD
  %% 範例圖:雙擊節點改字,從工具列拖箭頭
  S([開始])
  A[讀取設定檔]
  C{設定存在?}
  %% @comment C: 這個判斷之後想加快取
  F(改用預設值)
  style F fill:#ffec99
  E[啟動服務]
  style E fill:#b2f2bb,stroke:#2f9e44
  S --> A
  A --> C
  C -->|有| E
  C -.->|沒有| F
  F ==> E
`;

let doc = emptyDoc();
let positions = new Map();       // id -> {x, y};只活在畫面上,不匯出
let selection = null;            // {kind:'node', id} | {kind:'edge', index} | null
let tool = 'select';
let undoStack = [], redoStack = [];
let codeDirty = false;
let view = { x: -400, y: -300, w: 800, h: 600 };
let ghost = null;                // 拖箭頭時的預覽 {x1,y1,x2,y2}
let spaceHeld = false;

const measureCtx = document.createElement('canvas').getContext('2d');
const HAND_FONT = '15px "Chalkboard SE", "Bradley Hand", "Comic Sans MS", "PingFang TC", cursive';
measureCtx.font = HAND_FONT;

function displayLabel(n) { return n.shape === 'plain' || n.label == null ? n.id : n.label; }

function measureNode(n) {
  const tw = measureCtx.measureText(displayLabel(n)).width;
  if (n.shape === 'diamond') return { w: Math.max(90, tw * 1.7 + 44), h: Math.max(58, 46) };
  return { w: Math.max(72, tw + 40), h: 42 };
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// 手繪風對話泡泡(有註解的元素),hover 顯示內容並聚光
function commentBadge(x, y) {
  return `<g class="cbadge" transform="translate(${x},${y}) rotate(-5)">` +
    `<path d="M 3.5 0 H 14 Q 17.5 0 17.5 3.5 V 8.5 Q 17.5 12 14 12 H 8.6 L 3.4 16.2 L 5 12 H 3.5 Q 0 12 0 8.5 V 3.5 Q 0 0 3.5 0 Z" fill="#fff" stroke="#1e1e1e" stroke-width="1.3" stroke-linejoin="round"/>` +
    `<circle cx="5.2" cy="6" r="1" fill="#1e1e1e"/><circle cx="8.8" cy="6" r="1" fill="#1e1e1e"/><circle cx="12.4" cy="6" r="1" fill="#1e1e1e"/></g>`;
}

// ---------- 節點渲染 ----------
function nodeSvg(n, sizeMap) {
  const p = positions.get(n.id);
  if (!p) return '';
  const s = sizeMap.get(n.id);
  const x = p.x - s.w / 2, y = p.y - s.h / 2;
  const rnd = mulberry32(hash32(n.id) + ROUGH * 7919);
  const stroke = getProp(n.style, 'stroke') || '#1e1e1e';
  const fill = getProp(n.style, 'fill');
  const sw = parseFloat(getProp(n.style, 'stroke-width')) || 1.5;
  const dashProp = getProp(n.style, 'stroke-dasharray');
  const dash = dashProp ? ` stroke-dasharray="${esc(dashProp)}"` : '';
  const textColor = getProp(n.style, 'color') || '#1e1e1e';
  let body = '';
  if (n.shape !== 'plain') {
    const clean = cleanShapePath(n.shape, x, y, s.w, s.h);
    if (fill && fill !== 'none' && fill !== 'transparent') {
      body += `<clipPath id="clip-${esc(n.id)}"><path d="${clean}"/></clipPath>` +
        `<path class="hachure" clip-path="url(#clip-${esc(n.id)})" d="${hachurePath(x, y, s.w, s.h, rnd)}" stroke="${esc(fill)}" stroke-width="1.4" fill="none"/>`;
    }
    let outline;
    if (n.shape === 'diamond') {
      outline = roughPolyPath([[p.x, y], [x + s.w, p.y], [p.x, y + s.h], [x, p.y]], rnd);
    } else {
      outline = roughRoundRectPath(x, y, s.w, s.h, n.shape === 'stadium' ? s.h / 2 : n.shape === 'round' ? 12 : 3, rnd);
    }
    body += `<path d="${clean}" fill="#fff" opacity="0"/>` + // 點擊範圍
      `<path d="${outline}" fill="none" stroke="${esc(stroke)}" stroke-width="${sw}"${dash} stroke-linecap="round"/>`;
  } else {
    body += `<rect x="${x}" y="${y}" width="${s.w}" height="${s.h}" fill="#fff" opacity="0"/>`;
  }
  body += `<text class="nodeText" x="${p.x}" y="${p.y}" font-size="15" fill="${esc(textColor)}" text-anchor="middle" dominant-baseline="central">${esc(displayLabel(n))}</text>`;
  if (n.comment) body += commentBadge(x + s.w - 9, y - 16);
  if (selection && selection.kind === 'node' && selection.id === n.id) {
    const m = 7;
    body += `<rect class="selBox" x="${x - m}" y="${y - m}" width="${s.w + m * 2}" height="${s.h + m * 2}" rx="3"/>`;
    for (const [hx, hy] of [[x - m, y - m], [x + s.w + m, y - m], [x - m, y + s.h + m], [x + s.w + m, y + s.h + m]]) {
      body += `<rect class="selDot" x="${hx - 3.5}" y="${hy - 3.5}" width="7" height="7" rx="2"/>`;
    }
  }
  return `<g class="node" data-nid="${esc(n.id)}">${body}</g>`;
}

// ---------- 邊渲染 ----------
function clipToBox(cx, cy, dx, dy, size) {
  const hw = size.w / 2 + 6, hh = size.h / 2 + 6;
  let t = Infinity;
  if (dx) t = Math.min(t, hw / Math.abs(dx));
  if (dy) t = Math.min(t, hh / Math.abs(dy));
  if (!isFinite(t)) t = 0;
  return { x: cx + dx * t, y: cy + dy * t };
}

// 檢查 a→b 直線是否穿過其他節點;有就回傳弓形偏移量,沒有回 0
function obstructionBow(e, a, b, sizeMap) {
  const abx = b.x - a.x, aby = b.y - a.y;
  const len2 = abx * abx + aby * aby;
  if (!len2) return 0;
  let worst = 0;
  for (const n of doc.nodes) {
    if (n.id === e.from || n.id === e.to) continue;
    const p = positions.get(n.id);
    if (!p) continue;
    const t = Math.max(0, Math.min(1, ((p.x - a.x) * abx + (p.y - a.y) * aby) / len2));
    if (t < 0.08 || t > 0.92) continue;
    const qx = a.x + t * abx - p.x, qy = a.y + t * aby - p.y;
    const s = sizeMap.get(n.id);
    const clearance = Math.max(s.w, s.h) / 2 + 12;
    const dist = Math.hypot(qx, qy);
    if (dist < clearance) worst = Math.max(worst, clearance - dist + 22);
  }
  // 二次曲線在中點的實際偏移是控制點偏移的一半,所以乘 2
  return worst ? Math.min(worst * 2, 190) : 0;
}

function makeGroups() {
  const pair = new Map(), selfs = new Map();
  doc.edges.forEach((e, i) => {
    if (e.from === e.to) {
      if (!selfs.has(e.from)) selfs.set(e.from, []);
      selfs.get(e.from).push(i);
      return;
    }
    const k = e.from < e.to ? e.from + '|' + e.to : e.to + '|' + e.from;
    if (!pair.has(k)) pair.set(k, []);
    pair.get(k).push(i);
  });
  return {
    offset(i, e) {
      const k = e.from < e.to ? e.from + '|' + e.to : e.to + '|' + e.from;
      const arr = pair.get(k);
      let off = (arr.indexOf(i) - (arr.length - 1) / 2) * 18;
      if (e.from > e.to) off = -off; // 用排序後的方向當基準,反向邊才不會疊在一起
      return off;
    },
    selfIdx(i) { return selfs.get(doc.edges[i].from).indexOf(i); },
  };
}

// 開放式箭頭(Excalidraw 風):兩撇,不是實心三角
function arrowHeadPath(x, y, angle, size, rnd, out) {
  for (const da of [Math.PI * 0.82, -Math.PI * 0.82]) {
    roughSeg(x, y, x + Math.cos(angle + da) * size, y + Math.sin(angle + da) * size, rnd, out);
  }
}

function edgeSvg(e, i, sizeMap, groups) {
  const p1 = positions.get(e.from), p2 = positions.get(e.to);
  if (!p1 || !p2) return '';
  const rnd = mulberry32(hash32('e' + i + e.from + e.to) + ROUGH * 7919);
  const sel = selection && selection.kind === 'edge' && selection.index === i;
  const color = getProp(e.style, 'stroke') || '#1e1e1e';
  const sw = parseFloat(getProp(e.style, 'stroke-width')) || (e.type === 'thick' ? 3.2 : 1.5);
  const dash = e.type === 'dotted' ? ' stroke-dasharray="7 6"' : '';
  const parts = [];
  let hitD, lx, ly, endAngle, ex, ey;
  if (e.from === e.to) { // 自迴圈:節點右側繞一圈
    const s = sizeMap.get(e.from);
    const k = groups.selfIdx(i) * 20;
    const x = p1.x + s.w / 2, y = p1.y;
    hitD = `M ${x} ${y - 10} C ${x + 52 + k} ${y - 34 - k}, ${x + 52 + k} ${y + 34 + k}, ${x} ${y + 10}`;
    parts.push(hitD);
    lx = x + 58 + k; ly = y;
    ex = x; ey = y + 10; endAngle = Math.PI;
  } else {
    let dx = p2.x - p1.x, dy = p2.y - p1.y;
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    const off = groups.offset(i, e);
    const px = -dy * off, py = dx * off;
    const a = clipToBox(p1.x + px, p1.y + py, dx, dy, sizeMap.get(e.from));
    const b = clipToBox(p2.x + px, p2.y + py, -dx, -dy, sizeMap.get(e.to));
    const bow = obstructionBow(e, a, b, sizeMap) + (off ? off * 0.4 : 0);
    if (bow) {
      const cx = (a.x + b.x) / 2 - dy * bow, cy = (a.y + b.y) / 2 + dx * bow;
      hitD = `M ${a.x} ${a.y} Q ${cx} ${cy} ${b.x} ${b.y}`;
      parts.push(roughQuadPath(a.x, a.y, cx, cy, b.x, b.y, rnd));
      lx = (a.x + b.x) / 4 + cx / 2 - dy * 13; ly = (a.y + b.y) / 4 + cy / 2 + dx * 13 - 5;
      endAngle = Math.atan2(b.y - cy, b.x - cx);
    } else {
      hitD = `M ${a.x} ${a.y} L ${b.x} ${b.y}`;
      const segs = [];
      roughSeg(a.x, a.y, b.x, b.y, rnd, segs);
      parts.push(segs.join(' '));
      lx = (a.x + b.x) / 2; ly = (a.y + b.y) / 2 - 7;
      endAngle = Math.atan2(b.y - a.y, b.x - a.x);
    }
    ex = b.x; ey = b.y;
  }
  if (e.type !== 'line') {
    const head = [];
    arrowHeadPath(ex, ey, endAngle, 11 + sw * 1.6, rnd, head);
    parts.push(head.join(' '));
  }
  let extra = '';
  if (e.label) extra += `<text class="edgeLabel" x="${lx}" y="${ly}" font-size="13.5" fill="${esc(color)}" text-anchor="middle">${esc(e.label)}</text>`;
  if (e.comment) extra += commentBadge(lx + (e.label ? measureCtx.measureText(e.label).width / 2 + 9 : -9), ly - 20);
  const selHalo = sel ? `<path d="${hitD}" fill="none" stroke="#6965db" stroke-width="${sw + 5}" opacity=".25"/>` : '';
  return `<g class="edge" data-eidx="${i}"><path class="edgeHit" d="${hitD}"/>${selHalo}` +
    `<path d="${parts.join(' ')}" fill="none" stroke="${esc(color)}" stroke-width="${sw}"${dash} stroke-linecap="round"/>${extra}</g>`;
}

// ---------- 註解泡泡 hover:顯示內容 + 聚光(其他元素變淡) ----------
let hoverBadge = null;
function clearBadgeHover() {
  if (!hoverBadge) return;
  hoverBadge = null;
  $('commentTip').style.display = 'none';
  svgEl.classList.remove('dimming');
  for (const g of svgEl.querySelectorAll('.spot')) g.classList.remove('spot');
}
svgEl.addEventListener('pointerover', e => {
  const b = e.target.closest && e.target.closest('.cbadge');
  if (b === hoverBadge) return;
  clearBadgeHover();
  if (!b) return;
  const g = b.closest('[data-nid],[data-eidx]');
  let text = '';
  if (g && g.dataset.nid) {
    const n = doc.nodes.find(x => x.id === g.dataset.nid);
    text = (n && n.comment) || '';
  } else if (g) {
    const ed = doc.edges[+g.dataset.eidx];
    text = (ed && ed.comment) || '';
  }
  if (!text) return;
  hoverBadge = b;
  const tip = $('commentTip');
  tip.textContent = text;
  tip.style.display = 'block';
  const r = b.getBoundingClientRect();
  let tx = r.right + 10, ty = r.top - tip.offsetHeight - 6;
  if (tx + tip.offsetWidth > window.innerWidth - 8) tx = window.innerWidth - 8 - tip.offsetWidth;
  if (ty < 8) ty = r.bottom + 10;
  tip.style.left = tx + 'px';
  tip.style.top = ty + 'px';
  svgEl.classList.add('dimming');
  if (g) g.classList.add('spot');
});
svgEl.addEventListener('pointerleave', clearBadgeHover);

function renderCanvas() {
  clearBadgeHover(); // innerHTML 要重建了,舊的聚光/提示一起收掉
  const sizeMap = new Map(doc.nodes.map(n => [n.id, measureNode(n)]));
  const groups = makeGroups();
  let s = '';
  doc.edges.forEach((e, i) => { s += edgeSvg(e, i, sizeMap, groups); });
  for (const n of doc.nodes) s += nodeSvg(n, sizeMap);
  if (ghost) {
    s += `<path d="M ${ghost.x1} ${ghost.y1} L ${ghost.x2} ${ghost.y2}" fill="none" stroke="#6965db" stroke-width="1.5" stroke-dasharray="6 5" pointer-events="none"/>`;
  }
  if (!doc.nodes.length) {
    s += `<text x="${view.x + view.w / 2}" y="${view.y + view.h / 2}" text-anchor="middle" fill="#7a7a8c" font-size="15" font-family='"Chalkboard SE","Comic Sans MS",cursive'>空白畫布——選個形狀工具點一下,或雙擊這裡開始</text>`;
  }
  svgEl.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
  svgEl.innerHTML = s;
  $('zoomPct').textContent = Math.round(svgEl.getBoundingClientRect().width / view.w * 100) + '%';
}

// ---------- 面板 ----------
function swatches(el, colors, current, onPick) {
  el.innerHTML = '';
  for (const c of colors) {
    const b = document.createElement('button');
    b.className = 'sw' + (c == null ? ' none' : '') + ((c == null && current == null) || (c && current === c) ? ' picked' : '');
    if (c) b.style.background = c;
    b.title = c || '透明';
    b.addEventListener('click', () => onPick(c));
    el.appendChild(b);
  }
}

function pickIn(rowEl, attr, value) {
  for (const b of rowEl.querySelectorAll('.optBtn')) b.classList.toggle('picked', b.dataset[attr] === String(value ?? ''));
}

function renderProps() {
  const box = $('props');
  if (!selection) { box.classList.remove('open'); return; }
  box.classList.add('open');
  const isNode = selection.kind === 'node';
  $('propsNode').style.display = isNode ? '' : 'none';
  $('propsEdge').style.display = isNode ? 'none' : '';
  $('pReverse').style.display = isNode ? 'none' : '';
  $('pDup').style.display = isNode ? '' : 'none';
  if (isNode) {
    const n = doc.nodes.find(x => x.id === selection.id);
    if (!n) { selection = null; renderProps(); return; }
    $('pId').value = n.id;
    pickIn($('pShape'), 'shape', n.shape);
    swatches($('pStroke'), STROKES, getProp(n.style, 'stroke') || '#1e1e1e',
      c => mutateSel(nn => { nn.style = setProp(nn.style, 'stroke', c === '#1e1e1e' ? null : c); }));
    swatches($('pFill'), FILLS, getProp(n.style, 'fill'),
      c => mutateSel(nn => { nn.style = setProp(nn.style, 'fill', c); }));
    pickIn($('pWidth'), 'w', getProp(n.style, 'stroke-width') ? parseFloat(getProp(n.style, 'stroke-width')) : 2);
    pickIn($('pDash'), 'dash', getProp(n.style, 'stroke-dasharray') || '');
    $('pLabelTitle').textContent = n.shape === 'plain' ? '文字(純 ID 節點顯示的就是 ID)' : '文字';
    $('pLabel').disabled = n.shape === 'plain';
    $('pLabel').value = displayLabel(n);
    $('pComment').value = n.comment || '';
  } else {
    const e = doc.edges[selection.index];
    if (!e) { selection = null; renderProps(); return; }
    pickIn($('pEType'), 'etype', e.type);
    swatches($('pEStroke'), STROKES, getProp(e.style, 'stroke') || '#1e1e1e',
      c => {
        if (unknownHasEdgeTokens(doc)) {
          toast('注意:子集外語法裡也有邊,這個顏色(linkStyle)在真正的 mermaid 渲染時可能對到別條邊', true);
        }
        mutateSel(ee => { ee.style = setProp(ee.style, 'stroke', c === '#1e1e1e' ? null : c); });
      });
    $('pLabelTitle').textContent = '邊上的標籤';
    $('pLabel').disabled = false;
    $('pLabel').value = e.label || '';
    $('pComment').value = e.comment || '';
  }
}

function renderCode() { codeEl.value = serializeMermaid(doc); setDirty(false); }
function setDirty(d) {
  codeDirty = d;
  codeEl.classList.toggle('dirty', d);
  $('dirtyHint').textContent = d ? '程式碼改了還沒套用——按「套用程式碼」讓畫布跟上。' : '';
}
function renderDrawerMeta() {
  $('docComments').value = docCommentLines(doc).join('\n');
  const unk = unknownLines(doc);
  $('unknownWrap').hidden = !unk.length;
  if (unk.length) $('unknownBox').textContent = unk.join('\n');
}
function renderAll() { renderCanvas(); renderProps(); }

// ---------- 狀態變更 ----------
function saveDraft() {
  try { localStorage.setItem(DRAFT_KEY, serializeMermaid(doc)); } catch (_) { /* 無痕模式等情況,略過 */ }
}
function layoutMissing() {
  const ids = new Set(doc.nodes.map(n => n.id));
  for (const id of [...positions.keys()]) if (!ids.has(id)) positions.delete(id);
  if (doc.nodes.some(n => !positions.has(n.id))) {
    const fresh = autoLayout(doc, measureNode);
    for (const n of doc.nodes) if (!positions.has(n.id)) positions.set(n.id, fresh.get(n.id) || { x: 0, y: 0 });
  }
}
function afterDocChange() {
  layoutMissing();
  renderCode();
  renderDrawerMeta();
  saveDraft();
  renderAll();
}
function mutate(fn) {
  undoStack.push(serializeMermaid(doc));
  if (undoStack.length > 100) undoStack.shift();
  redoStack = [];
  fn();
  afterDocChange();
}
// 針對目前選取的元素做修改(節點傳 node、邊傳 edge 進 fn)
function mutateSel(fn) {
  if (!selection) return;
  if (selection.kind === 'node') {
    const id = selection.id;
    mutate(() => fn(doc.nodes.find(x => x.id === id)));
  } else {
    const idx = selection.index;
    mutate(() => fn(doc.edges[idx]));
  }
}
function undo() {
  if (!undoStack.length) { toast('沒有可復原的步驟了'); return; }
  redoStack.push(serializeMermaid(doc));
  doc = parseMermaid(undoStack.pop()).doc;
  selection = null;
  afterDocChange();
}
function redo() {
  if (!redoStack.length) { toast('沒有可重做的步驟了'); return; }
  undoStack.push(serializeMermaid(doc));
  doc = parseMermaid(redoStack.pop()).doc;
  selection = null;
  afterDocChange();
}
function applyCode(opts) {
  const { doc: d, warnings } = parseMermaid(codeEl.value);
  undoStack.push(serializeMermaid(doc));
  redoStack = [];
  doc = d;
  selection = null;
  positions = autoLayout(doc, measureNode);
  renderCode();
  renderDrawerMeta();
  saveDraft();
  fitView();
  renderAll();
  for (const w of warnings) toast(w, true);
  if (!warnings.length && !(opts && opts.quiet)) toast('已套用');
  $('selDir').value = doc.dir;
}

// ---------- 視圖 ----------
function fitView() {
  const rect = svgEl.getBoundingClientRect();
  const aspect = rect.width && rect.height ? rect.width / rect.height : 4 / 3;
  if (!doc.nodes.length) {
    view = { x: -400, y: -400 / aspect, w: 800, h: 800 / aspect };
    return;
  }
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const n of doc.nodes) {
    const p = positions.get(n.id);
    if (!p) continue;
    const s = measureNode(n);
    minX = Math.min(minX, p.x - s.w / 2); maxX = Math.max(maxX, p.x + s.w / 2 + 80);
    minY = Math.min(minY, p.y - s.h / 2); maxY = Math.max(maxY, p.y + s.h / 2);
  }
  const pad = 70;
  minX -= pad; minY -= pad; maxX += pad; maxY += pad;
  let w = maxX - minX, h = maxY - minY;
  if (w / h < aspect) { const nw = h * aspect; minX -= (nw - w) / 2; w = nw; }
  else { const nh = w / aspect; minY -= (nh - h) / 2; h = nh; }
  view = { x: minX, y: minY, w, h };
}
function zoomBy(factor, cx, cy) {
  const px = cx == null ? view.x + view.w / 2 : cx;
  const py = cy == null ? view.y + view.h / 2 : cy;
  const rect = svgEl.getBoundingClientRect();
  const minW = 120, maxW = rect.width * 40;
  const nw = Math.max(minW, Math.min(maxW, view.w * factor));
  const f = nw / view.w;
  view = { x: px - (px - view.x) * f, y: py - (py - view.y) * f, w: view.w * f, h: view.h * f };
  renderCanvas();
}
function toWorld(clientX, clientY) {
  const r = svgEl.getBoundingClientRect();
  return { x: view.x + (clientX - r.left) / r.width * view.w, y: view.y + (clientY - r.top) / r.height * view.h };
}
function toScreen(wx, wy) {
  const r = svgEl.getBoundingClientRect();
  return { x: r.left + (wx - view.x) / view.w * r.width, y: r.top + (wy - view.y) / view.h * r.height };
}

// ---------- 行內文字編輯 ----------
const inlineEl = $('inlineEdit');
let inlineCommit = null;
function openInlineEdit(wx, wy, wWidth, value, placeholder, onCommit) {
  const scr = toScreen(wx, wy);
  const scale = svgEl.getBoundingClientRect().width / view.w;
  const wpx = Math.max(90, wWidth * scale);
  inlineEl.style.display = 'block';
  inlineEl.style.left = (scr.x - wpx / 2) + 'px';
  inlineEl.style.top = (scr.y - 14 * scale) + 'px';
  inlineEl.style.width = wpx + 'px';
  inlineEl.style.fontSize = Math.max(11, 15 * scale) + 'px';
  inlineEl.value = value;
  inlineEl.placeholder = placeholder || '';
  inlineCommit = onCommit;
  setTimeout(() => { inlineEl.focus(); inlineEl.select(); }, 0);
}
function closeInlineEdit(commit) {
  if (inlineEl.style.display === 'none' || !inlineEl.style.display) return;
  const fn = inlineCommit;
  inlineCommit = null;
  inlineEl.style.display = 'none';
  if (commit && fn) fn(inlineEl.value.trim());
}
inlineEl.addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Enter') { e.preventDefault(); closeInlineEdit(true); }
  if (e.key === 'Escape') closeInlineEdit(false);
});
inlineEl.addEventListener('blur', () => closeInlineEdit(true));

function editNodeLabel(id) {
  const n = doc.nodes.find(x => x.id === id);
  if (!n) return;
  if (n.shape === 'plain') { toast('純 ID 節點顯示的就是 ID,到左邊面板改 ID'); return; }
  const p = positions.get(id), s = measureNode(n);
  openInlineEdit(p.x, p.y, s.w + 30, n.label ?? '', '輸入文字', v => {
    mutate(() => { doc.nodes.find(x => x.id === id).label = v || id; });
  });
}
function editEdgeLabel(idx) {
  const e = doc.edges[idx];
  const p1 = positions.get(e.from), p2 = positions.get(e.to);
  if (!p1 || !p2) return;
  openInlineEdit((p1.x + p2.x) / 2, (p1.y + p2.y) / 2, 110, e.label || '', '標籤(可留空)', v => {
    mutate(() => { doc.edges[idx].label = v.replace(/\|/g, '/') || null; });
  });
}

// ---------- 建立元素 ----------
function freeId() {
  let i = 1;
  while (doc.nodes.some(n => n.id === 'N' + i)) i++;
  return 'N' + i;
}
const TOOL_SHAPE = { rect: 'rect', diamond: 'diamond', stadium: 'stadium' };
function createNodeAt(wx, wy, shape, thenEdit) {
  const id = freeId();
  positions.set(id, { x: wx, y: wy });
  const node = { id, shape, label: '', comment: '', style: null };
  mutate(() => { doc.nodes.push(node); doc.stream.push({ kind: 'node', ref: node }); });
  selection = { kind: 'node', id };
  renderAll();
  if (thenEdit) editNodeLabel(id);
  return id;
}
function createEdge(fromId, toId, kind) {
  const edge = { from: fromId, to: toId, type: kind === 'line' ? 'line' : 'arrow', label: null, comment: '', style: null };
  mutate(() => { doc.edges.push(edge); doc.stream.push({ kind: 'edge', ref: edge }); });
  selection = { kind: 'edge', index: doc.edges.length - 1 };
  renderAll();
}

// ---------- 指標互動 ----------
let drag = null;
// 自己偵測雙擊:innerHTML 重繪會讓瀏覽器原生 dblclick 打在已拆除的舊元素上收不到
let lastClick = null; // {kind, id/idx/x/y, t}
function isDouble(kind, key) {
  const now = performance.now();
  const hit = lastClick && lastClick.kind === kind && lastClick.key === key && now - lastClick.t < 350;
  lastClick = hit ? null : { kind, key, t: now };
  return hit;
}
const pointers = new Map(); // 多指(pinch)追蹤
let pinch = null;

function hitNode(target) { const g = target.closest && target.closest('[data-nid]'); return g ? g.dataset.nid : null; }
function hitEdge(target) { const g = target.closest && target.closest('[data-eidx]'); return g ? +g.dataset.eidx : null; }
// setPointerCapture 之後 e.target 會固定成 svg,拖曳中要找「指標下的節點」得用 elementFromPoint
function nodeUnderPointer(e) {
  const el = document.elementFromPoint(e.clientX, e.clientY);
  return el ? hitNode(el) : null;
}

svgEl.addEventListener('pointerdown', e => {
  closeInlineEdit(true);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  // 一律先 capture:pointerup 才保證回到 svg 清掉 pointers,不會留 stale entry 誤判 pinch
  try { svgEl.setPointerCapture(e.pointerId); } catch (_) { /* 已釋放的 pointer,略過 */ }
  if (pointers.size === 2) { // 進入雙指縮放,取消單指拖曳
    const pts = [...pointers.values()];
    pinch = { d: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) };
    drag = null; ghost = null;
    renderCanvas();
    return;
  }
  if (e.button !== undefined && e.button !== 0) return;
  const nid = hitNode(e.target);
  const eidx = hitEdge(e.target);
  const pt = toWorld(e.clientX, e.clientY);
  const panish = tool === 'hand' || spaceHeld;
  if (panish) {
    drag = { kind: 'pan', sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, moved: false };
  } else if (tool === 'arrow' || tool === 'line') {
    if (nid) {
      drag = { kind: 'connect', from: nid, moved: false };
      ghost = { x1: positions.get(nid).x, y1: positions.get(nid).y, x2: pt.x, y2: pt.y };
    } else {
      toast('從一個節點開始拖,放到另一個節點(或空白處長新節點)');
      drag = { kind: 'pan', sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, moved: false };
    }
  } else if (TOOL_SHAPE[tool]) {
    if (nid) {
      selection = { kind: 'node', id: nid };
      renderAll();
    } else {
      createNodeAt(pt.x, pt.y, TOOL_SHAPE[tool], true);
      setTool('select');
    }
    return;
  } else { // select
    if (nid) {
      const p = positions.get(nid);
      drag = { kind: 'node', id: nid, dx: pt.x - p.x, dy: pt.y - p.y, moved: false };
    } else if (eidx != null) {
      if (isDouble('edge', eidx)) { editEdgeLabel(eidx); return; }
      selection = { kind: 'edge', index: eidx };
      renderAll();
      return;
    } else {
      drag = { kind: 'pan', sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, moved: false };
    }
  }
  if (drag && drag.kind === 'pan') svgEl.classList.add('panning');
});

svgEl.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size === 2) {
    const pts = [...pointers.values()];
    const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (d > 20) {
      const mid = toWorld((pts[0].x + pts[1].x) / 2, (pts[0].y + pts[1].y) / 2);
      zoomBy(pinch.d / d, mid.x, mid.y);
      pinch.d = d;
    }
    return;
  }
  if (!drag) return;
  const r = svgEl.getBoundingClientRect();
  const pt = toWorld(e.clientX, e.clientY);
  if (drag.kind === 'node') {
    if (!drag.moved && Math.hypot(pt.x - drag.dx - positions.get(drag.id).x, pt.y - drag.dy - positions.get(drag.id).y) < 3) return;
    drag.moved = true;
    positions.set(drag.id, { x: pt.x - drag.dx, y: pt.y - drag.dy });
    renderCanvas();
  } else if (drag.kind === 'connect') {
    drag.moved = true;
    const overId = nodeUnderPointer(e);
    const p1 = positions.get(drag.from);
    const end = overId && overId !== drag.from ? positions.get(overId) : pt;
    ghost = { x1: p1.x, y1: p1.y, x2: end.x, y2: end.y };
    renderCanvas();
  } else if (drag.kind === 'pan') {
    const dx = (e.clientX - drag.sx) / r.width * view.w;
    const dy = (e.clientY - drag.sy) / r.height * view.h;
    if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 3) drag.moved = true;
    view.x = drag.vx - dx; view.y = drag.vy - dy;
    renderCanvas();
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  svgEl.classList.remove('panning');
  if (!drag) return;
  const d = drag;
  drag = null;
  if (d.kind === 'connect') {
    ghost = null;
    const overId = nodeUnderPointer(e);
    const pt = toWorld(e.clientX, e.clientY);
    if (!d.moved && !overId) { renderCanvas(); return; }
    if (overId) {
      createEdge(d.from, overId, tool); // 同一節點=自迴圈,也合法
    } else {
      const nid = createNodeAt(pt.x, pt.y, 'rect', false);
      createEdge(d.from, nid, tool);
      editNodeLabel(nid);
    }
    setTool('select');
    return;
  }
  if (d.kind === 'node' && !d.moved) {
    if (isDouble('node', d.id)) { selection = { kind: 'node', id: d.id }; editNodeLabel(d.id); return; }
    selection = { kind: 'node', id: d.id };
    renderAll();
  } else if (d.kind === 'pan' && !d.moved) {
    if (isDouble('bg', Math.round(e.clientX / 24) + ',' + Math.round(e.clientY / 24))) {
      const pt = toWorld(e.clientX, e.clientY);
      createNodeAt(pt.x, pt.y, 'rect', true);
      return;
    }
    selection = null;
    renderAll();
  }
}
svgEl.addEventListener('pointerup', endPointer);
svgEl.addEventListener('pointercancel', endPointer);


// 滾輪:平移;Ctrl/Cmd+滾輪(含觸控板捏合):縮放 —— Figma/Excalidraw 慣例
svgEl.addEventListener('wheel', e => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) {
    const pt = toWorld(e.clientX, e.clientY);
    zoomBy(Math.exp(e.deltaY * 0.01), pt.x, pt.y);
  } else {
    const r = svgEl.getBoundingClientRect();
    view.x += (e.shiftKey ? e.deltaY : e.deltaX) / r.width * view.w;
    view.y += (e.shiftKey ? 0 : e.deltaY) / r.height * view.h;
    renderCanvas();
  }
}, { passive: false });

svgEl.addEventListener('contextmenu', e => e.preventDefault());

// ---------- 工具切換與快捷鍵 ----------
function setTool(t) {
  tool = t;
  ghost = null;
  for (const b of document.querySelectorAll('#toolbar .toolBtn')) b.classList.toggle('active', b.dataset.tool === t);
  svgEl.classList.toggle('tool-hand', t === 'hand');
  svgEl.classList.toggle('tool-shape', !!TOOL_SHAPE[t] || t === 'arrow' || t === 'line');
}
for (const b of document.querySelectorAll('#toolbar .toolBtn')) {
  b.addEventListener('click', () => setTool(b.dataset.tool));
}

const KEY_TOOL = { v: 'select', 1: 'select', h: 'hand', r: 'rect', 2: 'rect', d: 'diamond', 3: 'diamond', o: 'stadium', 4: 'stadium', a: 'arrow', 5: 'arrow', l: 'line', 6: 'line' };
document.addEventListener('keydown', e => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  if (e.key === ' ' && !typing) { spaceHeld = true; svgEl.classList.add('tool-hand'); e.preventDefault(); return; }
  if (e.key === 'Escape') {
    if (!typing) { selection = null; ghost = null; setTool('select'); renderAll(); }
    return;
  }
  if (typing) {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && document.activeElement === codeEl) applyCode();
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    if (e.shiftKey) redo(); else undo();
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'd') {
    e.preventDefault();
    duplicateSelection();
    return;
  }
  if ((e.key === 'Delete' || e.key === 'Backspace') && selection) { e.preventDefault(); deleteSelection(); return; }
  if (e.key === 'Enter' && selection && selection.kind === 'node') { e.preventDefault(); editNodeLabel(selection.id); return; }
  if (!e.metaKey && !e.ctrlKey && KEY_TOOL[e.key.toLowerCase()]) setTool(KEY_TOOL[e.key.toLowerCase()]);
});
document.addEventListener('keyup', e => {
  if (e.key === ' ') { spaceHeld = false; if (tool !== 'hand') svgEl.classList.remove('tool-hand'); }
});

// ---------- 選取操作 ----------
function deleteSelection() {
  if (!selection) return;
  if (selection.kind === 'node') {
    const id = selection.id;
    mutate(() => {
      doc.nodes = doc.nodes.filter(n => n.id !== id);
      doc.edges = doc.edges.filter(e => e.from !== id && e.to !== id);
    });
  } else {
    const idx = selection.index;
    mutate(() => { doc.edges.splice(idx, 1); });
  }
  selection = null;
  renderAll();
}
function duplicateSelection() {
  if (!selection || selection.kind !== 'node') return;
  const src = doc.nodes.find(x => x.id === selection.id);
  if (!src) return;
  const id = freeId();
  const p = positions.get(src.id);
  positions.set(id, { x: p.x + 40, y: p.y + 40 });
  const node = { id, shape: src.shape, label: src.label, comment: src.comment, style: src.style };
  mutate(() => { doc.nodes.push(node); doc.stream.push({ kind: 'node', ref: node }); });
  selection = { kind: 'node', id };
  renderAll();
}

// ---------- 屬性面板事件 ----------
$('pId').addEventListener('change', e => {
  if (!selection || selection.kind !== 'node') return;
  const oldId = selection.id;
  const newId = e.target.value.trim();
  if (newId === oldId) return;
  if (!/^[A-Za-z0-9_]+$/.test(newId)) { toast('ID 只能用英文、數字、底線', true); renderProps(); return; }
  if (doc.nodes.some(n => n.id === newId)) { toast('ID「' + newId + '」已經有人用了', true); renderProps(); return; }
  const p = positions.get(oldId);
  mutate(() => {
    doc.nodes.find(x => x.id === oldId).id = newId;
    for (const ed of doc.edges) {
      if (ed.from === oldId) ed.from = newId;
      if (ed.to === oldId) ed.to = newId;
    }
  });
  if (p) positions.set(newId, p);
  selection = { kind: 'node', id: newId };
  renderAll();
});

}

// ---------- 提示 ----------
function toast(msg, warn) {
  const el = document.createElement('div');
  el.className = 'toast' + (warn ? ' warn' : '');
  el.textContent = msg;
  el.addEventListener('click', () => el.remove());
  $('toasts').appendChild(el);
  setTimeout(() => el.remove(), warn ? 9000 : 3500);
}

// ---------- 對外 hook(console 自測與除錯用) ----------
window.__diagramEditor = Object.freeze({
  parse: parseMermaid,
  serialize: serializeMermaid,
  agentPreamble,
  runRoundTripTest,
});

// ---------- 啟動 ----------
window.addEventListener('resize', () => {
  const r = svgEl.getBoundingClientRect();
  if (r.width && r.height) { view.h = view.w * r.height / r.width; renderCanvas(); }
});

(function init() {
  let stored = null, roughPref = null;
  try {
    stored = localStorage.getItem(DRAFT_KEY);
    roughPref = localStorage.getItem(ROUGH_KEY);
  } catch (_) { /* 無痕模式,忽略 */ }
  if (roughPref != null) { ROUGH = +roughPref; $('selRough').value = roughPref; }
  codeEl.value = stored || SAMPLE;
  setTool('select');
  applyCode({ quiet: true });
  if (stored) toast('已還原上次的草稿(存在這個瀏覽器的 localStorage)');
})();
</script>
