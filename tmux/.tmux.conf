# Enable mouse support (scroll, click panes, resize)
set -g mouse on

# Use vim-style keys in copy mode
setw -g mode-keys vi

# PageUp enters copy mode and scrolls up
bind-key -n PageUp copy-mode -u

# Status bar color - transparent bg with blue text
set -g status-style 'bg=default fg=colour24'

# Window list - transparent background
set -g window-status-style 'bg=default'
set -g window-status-current-style 'bg=default'

# Pane border colors
set -g pane-border-style 'fg=colour240 bg=default'
set -g pane-active-border-style 'fg=colour24 bg=default'
set -g pane-border-lines double

# Larger scrollback for mobile review
set -g history-limit 50000

# --- Shift+Enter 等「可辨識按鍵」給 Claude Code / Codex ---
# 終端機預設分不出 Shift+Enter 與 Enter，要靠 kitty 鍵盤協定 (CSI u)。
# CC/Codex 在 tmux 裡偵測不到外層終端機，不會主動送協定啟用序列，
# 所以要叫 tmux 無條件 (always) 把 extended keys 轉發給每個 pane。
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'
# 讓通知/進度等 OSC 序列穿過 tmux 傳到外層 iTerm2
set -g allow-passthrough on
