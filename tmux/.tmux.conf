# Enable mouse support (scroll, click panes, resize)
set -g mouse on

# Use vim-style keys in copy mode
setw -g mode-keys vi

# PageUp enters copy mode and scrolls up
bind-key -n PageUp copy-mode -u

# Truecolor (24-bit RGB) so hex purples render exactly, not quantized to 256.
# Keep terminal-features idempotent so repeated `source ~/.tmux.conf` does not
# append duplicate array entries.
set -gu terminal-features
set -g terminal-features[0] 'xterm*:clipboard:ccolour:cstyle:focus:title:extkeys:RGB'
set -g terminal-features[1] 'screen*:title'
set -g terminal-features[2] 'rxvt*:ignorefkeys'

# Status bar - solid purple bar with bright lavender text
set -g status-style 'bg=#3a2d5c fg=#c6a8f0'

# Left - session id chip (one ghostty tab = one session). Dark bg + light
# text reads softer than a bright fill.
set -g status-left-length 30
set -g status-left '#[bg=#4a3a70,fg=#e6dcff,bold] #S #[default] '

# Window list - dimmed; one window per session so it's de-emphasized
set -g window-status-style 'bg=default fg=#6a5f87'
set -g window-status-current-style 'bg=default fg=#b3a3d6'

# Right - clock chip, matches the session chip
set -g status-right-length 100
set -g status-right '#[bg=#4a3a70,fg=#e6dcff,bold] %H:%M %d-%b-%y #[default]'

# Per-pane labels on each pane border: index:pane_id title. No bg on either.
# Focused pane = light purple bold; unfocused = teal. Different hue (purple vs
# teal) plus the focused pane's bright border line + bold make it pop. pane_id
# (%N) is stable for addressing panes (send-keys -t %N) even as pane_index shifts.
set -g pane-border-status top
set -g pane-border-format '#{?pane_active,#[fg=#dccaf7]#[bold],#[fg=#a7c7c7]} #{pane_index}:#{pane_id} #{pane_title} #[default]'

# Pane border colors - lavender active, dim purple inactive
set -g pane-border-style 'fg=#4a4060 bg=default'
set -g pane-active-border-style 'fg=#c6a8f0 bg=default'
set -g pane-border-lines double

# Larger scrollback for mobile review
set -g history-limit 50000

# --- Pane layout: orchestrator stays left, new panes stack on the right ---
# main-vertical = one big "main" pane on the left (full height) with every other
# pane stacked in a column on the right. The first pane (index 0, normally the
# orchestrator) is the main pane, so it stays on the left. The hook re-applies
# the layout after each split, so any new pane lands in the right-hand stack.
# To opt out for one window, run: select-layout even-horizontal (or tiled).
set -g main-pane-width 60%
set-hook -g after-split-window 'select-layout main-vertical'

# --- Shift+Enter 等「可辨識按鍵」給 Claude Code / Codex ---
# 終端機預設分不出 Shift+Enter 與 Enter；Ghostty 會把 Shift+Enter 送成
# CSI 13;2u，tmux 再用 csi-u 格式轉發給 pane 裡的 TUI。
set -s extended-keys always
set -s extended-keys-format csi-u
# 讓通知/進度等 OSC 序列穿過 tmux 傳到外層 iTerm2
set -g allow-passthrough on
