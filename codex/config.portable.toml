# Git-tracked Codex settings that install.sh syncs through the Codex app-server
# into runtime-owned ~/.codex/config.toml. Keep this limited to stable defaults.

[agents]
enabled = true
max_concurrent_threads_per_session = 100
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"
